version: 2

project_name: harness

before:
  hooks:
    - task tidy

builds:
  - id: harness-core
    main: ./cmd/harness/main-harness.go
    binary: harness
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/harness/cli/v3/pkg/hbase.Version={{.Version}}
      - -X github.com/harness/cli/v3/pkg/hbase.BuildTime={{.Date}}
      - -X github.com/harness/cli/v3/pkg/telemetry.segmentWriteKey={{.Env.SEGMENT_WRITE_KEY}}

  - id: harness-plugin-har
    main: ./modules/har/cmd/harness-har/main-harness-har.go
    binary: harness-har
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/harness/cli/v3/pkg/hbase.Version={{.Version}}
      - -X github.com/harness/cli/v3/pkg/hbase.BuildTime={{.Date}}

archives:
  - id: harness-bundle
    ids: [harness-core, harness-plugin-har]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "harness-bundle_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: harness-core
    ids: [harness-core]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "harness-core_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: harness-plugin-har
    ids: [harness-plugin-har]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "harness-plugin-har_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: harness-core
    package_name: harness-cli
    ids: [harness-core]
    formats:
      - deb
      - rpm
    vendor: Harness
    homepage: https://harness.io
    maintainer: Harness <support@harness.io>
    description: Harness Unified CLI
    license: Apache-2.0
    bindir: /usr/bin

homebrew_casks:
  # Installs the core `harness` binary only — modules/plugins are pulled in
  # afterwards with `harness install module <name>`.
  - name: harness-cli
    ids: [harness-core]
    binaries: [harness]
    # "auto" publishes on stable tags and skips prerelease tags (v1.2.3-rc1),
    # so an rc never becomes what `brew install` hands out.
    skip_upload: auto
    repository:
      owner: harness
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://harness.io"
    description: "Harness Unified CLI"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/harness"]
          end
          system_command "#{staged_path}/harness",
                         args: ["--post-install"],
                         env: { "HARNESS_INSTALL_TYPE" => "brew" },
                         must_succeed: false

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  disable: true

release:
  github:
    owner: harness
    name: cli
  draft: false
  prerelease: auto
  header: "Harness Unified CLI {{ .Tag }}"
