      columns: [id, status, summary, started, ended]

  # ── branch ──────────────────────────────────────────────────────────────────

  - command: list branch
    verb: list
    noun: branch
    short: "List branches: harness list branch <repo_id>"
    handler_type: endpoint
    requires_parentid: true
    parentid_label: "<repo_id>"
    flags:
      - name: search
        description: Filter by branch name
    endpoint:
      path: /code/api/v1/repos/{{ctx.parentId}}/branches
      items_expr: it
      get_id_expr: it.name
      query_params:
        query: flags.search
        page: flags.page
        limit: flags.limit
      paging:
        paging_strategy: page_header
        countable: false
        page_index_param: page
        page_size_param: limit
        page_size_default: 30
        page_size_max: 100
        page_base: 1
      columns: [name, sha8, is_default, author, updated]

  - command: get branch
    verb: get
    noun: branch
    short: "Get branch details: harness get branch <repo_id>/<branch_name>"
    handler_type: endpoint
    id_parts: 2
    completion_seq:
      - completion_noun: repository
      - completion_noun: branch
        keep_order: true
    endpoint:
      path: /code/api/v1/repos/{{ctx.idParts[0]}}/branches/{{ctx.idParts[1]}}
      item_expr: it

  - command: create branch
    verb: create
    noun: branch
    short: "Create a branch: harness create branch <repo_id> --set name=<branch> target=<sha_or_branch>"
    handler_type: endpoint
    flags_builtin:
      set: true
    endpoint:
      method: POST
      path: /code/api/v1/repos/{{ctx.id}}/branches
      create_strategy: set-fields
      create_body_wrap: ""
      text_header: "\nCreated branch {{it.name}}\n"

  - command: delete branch
    verb: delete
    noun: branch
    confirm_mode: prompt
    short: "Delete a branch: harness delete branch <repo_id>/<branch_name>"
    handler_type: endpoint
    id_parts: 2
    endpoint:
      method: DELETE
      path: /code/api/v1/repos/{{ctx.idParts[0]}}/branches/{{ctx.idParts[1]}}
      item_expr: it

  # ── commit ───────────────────────────────────────────────────────────────────

  - command: list commit
    verb: list
    noun: commit
    short: "List commits: harness list commit <repo_id> [--branch <ref>]"
    handler_type: endpoint
    requires_parentid: true
    parentid_label: "<repo_id>"
    completion_noun: repository
    flags:
      - name: branch
        description: Git ref (branch/tag/SHA) to list commits from
      - name: path
        description: Filter commits by file path
    endpoint:
      path: /code/api/v1/repos/{{ctx.parentId}}/commits
      items_expr: it.commits
      get_id_expr: it.sha
      query_params:
        git_ref: flags.branch
        path: flags.path
        page: flags.page
        limit: flags.limit
      paging:
        paging_strategy: page_header
        countable: false
        page_index_param: page
        page_size_param: limit
        page_size_default: 20
        page_size_max: 100
        page_base: 1
      columns: [sha, title, author, authored]

  - command: get commit
    verb: get
    noun: commit
    short: "Get commit details: harness get commit <repo_id>/<sha>"
    handler_type: endpoint
    id_parts: 2
    completion_seq:
      - completion_noun: repository
      - completion_noun: commit
        keep_order: true
    endpoint:
      path: /code/api/v1/repos/{{ctx.idParts[0]}}/commits/{{ctx.idParts[1]}}
      item_expr: it

  # ── tag ──────────────────────────────────────────────────────────────────────

  - command: list tag
    verb: list
    noun: tag
    short: "List tags: harness list tag <repo_id>"
    handler_type: endpoint
    requires_parentid: true
    parentid_label: "<repo_id>"
    flags:
      - name: search
        description: Filter by tag name
    endpoint:
      path: /code/api/v1/repos/{{ctx.parentId}}/tags
      items_expr: it
      get_id_expr: it.name
      query_params:
        query: flags.search
        page: flags.page
        limit: flags.limit
      paging:
        paging_strategy: page_header
        countable: false
        page_index_param: page
        page_size_param: limit
        page_size_default: 30
        page_size_max: 100
        page_base: 1
      columns: [name, sha, message]

  - command: create tag
    verb: create
    noun: tag
    short: "Create a tag: harness create tag <repo_id> --set name=<tag> target=<sha>"
    handler_type: endpoint
    flags_builtin:
      set: true
    endpoint:
      method: POST
      path: /code/api/v1/repos/{{ctx.id}}/tags
      create_strategy: set-fields
      create_body_wrap: ""
      text_header: "\nCreated tag {{it.name}}\n"

  - command: delete tag
    verb: delete
    noun: tag
    confirm_mode: prompt
    short: "Delete a tag: harness delete tag <repo_id>/<tag_name>"
    handler_type: endpoint
    id_parts: 2
    endpoint:
      method: DELETE
      path: /code/api/v1/repos/{{ctx.idParts[0]}}/tags/{{ctx.idParts[1]}}
      item_expr: it

  # ── pr_activity ───────────────────────────────────────────────────────────────

  - command: list pr_activity
    verb: list
    noun: pr_activity
    short: "List PR activity (comments, reviews, state changes): harness list pr_activity <repo_id>/<pr_number>"
    handler_type: endpoint
    requires_parentid: true
    parentid_label: "<repo_id>/<pr_number>"
    id_parts: 2
    completion_seq:
      - completion_noun: repository
      - completion_noun: pr
        keep_order: true
    flags:
      - name: kind
        description: "Filter by kind: comment, system, change-comment"
        completion_values: [comment, system, change-comment]
      - name: type
        description: "Filter by type: comment, code-comment, review-submit, state-change, ..."
    endpoint:
      path: /code/api/v1/repos/{{ctx.parentIdParts[0]}}/pullreq/{{ctx.parentIdParts[1]}}/activities
      items_expr: it
      get_id_expr: "-"
      query_params:
        kind: flags.kind
        type: flags.type
        limit: flags.limit
      paging:
        paging_strategy: flat_list
      columns: [id, kind, type, author, text, created]

  # ── pr_commit ────────────────────────────────────────────────────────────────

  - command: list pr_commit
    verb: list
    noun: pr_commit
    fields_noun: commit
    short: "List commits in a pull request: harness list pr_commit <repo_id>/<pr_number>"
    handler_type: endpoint
    requires_parentid: true
    parentid_label: "<repo_id>/<pr_number>"
    id_parts: 2
    completion_seq:
      - completion_noun: repository
      - completion_noun: pr
        keep_order: true
    endpoint:
      path: /code/api/v1/repos/{{ctx.parentIdParts[0]}}/pullreq/{{ctx.parentIdParts[1]}}/commits
      items_expr: it
      get_id_expr: ctx.parentIdParts[0] + "/" + it.sha
      query_params:
        page: flags.page
        limit: flags.limit
      paging:
        paging_strategy: page_header
        countable: false
        page_index_param: page
        page_size_param: limit
        page_size_default: 30
        page_size_max: 100
        page_base: 1
      columns: [sha, title, author, authored]

  - command: get pr_commit
    verb: get
    noun: pr_commit
    fields_noun: commit
    short: "Get a commit in a pull request: harness get pr_commit <repo_id>/<sha>"
    handler_type: endpoint
    id_parts: 2
    completion_seq:
      - completion_noun: repository
      - completion_noun: commit
        keep_order: true
    endpoint:
      path: /code/api/v1/repos/{{ctx.idParts[0]}}/commits/{{ctx.idParts[1]}}
      item_expr: it

  # ── commit_check ─────────────────────────────────────────────────────────────

  - command: list commit_check
    verb: list
    noun: commit_check
    short: "List status check results for a specific commit: harness list commit_check <repo_id>/<commit_sha>"
    handler_type: endpoint
    requires_parentid: true
    parentid_label: "<repo_id>/<commit_sha>"
    id_parts: 2
    completion_seq:
      - completion_noun: repository
      - completion_noun: commit
        keep_order: true
    flags:
      - name: search
        description: Filter by check identifier substring
    endpoint:
      path: /code/api/v1/repos/{{ctx.parentIdParts[0]}}/checks/commits/{{ctx.parentIdParts[1]}}
      items_expr: it
      get_id_expr: it.identifier
      query_params:
        query: flags.search
        page: flags.page
        limit: flags.limit
      paging:
        paging_strategy: page_header
        countable: false
        page_index_param: page
        page_size_param: limit
        page_size_default: 30
        page_size_max: 100
        page_base: 1
      columns: [identifier, status, summary, reported_by, duration]

  # ── pr_check ─────────────────────────────────────────────────────────────────

  - command: list pr_check
    verb: list
    noun: pr_check
    short: "List status checks for a pull request: harness list pr_check <repo_id>/<pr_number>"
    handler_type: endpoint
    requires_parentid: true
    parentid_label: "<repo_id>/<pr_number>"
    id_parts: 2
    completion_seq:
      - completion_noun: repository
      - completion_noun: pr
        keep_order: true
    endpoint:
      path: /code/api/v1/repos/{{ctx.parentIdParts[0]}}/pullreq/{{ctx.parentIdParts[1]}}/checks
      items_expr: it.checks
      get_id_expr: ctx.parentId + "/" + it.check.identifier
      paging:
        paging_strategy: flat_list
      completion:
        id_expr: it.check.identifier
        name_expr: it.check.status
      columns: [identifier, status, required, summary, reported_by, duration]

  - command: get pr_check
    verb: get
    noun: pr_check
    short: "Get a status check on a pull request: harness get pr_check <repo_id>/<pr_number>/<check_identifier>"
    handler_type: workflow
    workflow_id: get_pr_check
    item_fn: get_pr_check_item
    id_parts: 3
    id_label: "<repo_id>/<pr_number>/<check_identifier>"
    completion_seq:
      - completion_noun: repository
      - completion_noun: pr
        keep_order: true
      - completion_noun: pr_check

  - command: get pr_check:log
    verb: get
    noun: pr_check
    noun_variant: log
    short: "Fetch pipeline logs for a PR check: harness get pr_check:log <repo_id>/<pr_number>/<check_identifier>"
    long: |
      Resolves a pull request status check to its backing Harness pipeline execution
      and dumps the logs of every step under that execution's stage, in order
      (excluding the stage's own top-level log), scoped to the pipeline's own
      org/project (which may differ from the current --profile/--org/--project).
      If the stage is still running, streams live and exits when it reaches a
      terminal state. Fails with a clear error if the check has no associated
      pipeline execution (external check, webhook-reported status, etc).
    handler_type: workflow
    workflow_id: get_pr_check_log
    item_fn: get_pr_check_log_item
    fields_noun: pr_check_log
    id_parts: 3
    id_label: "<repo_id>/<pr_number>/<check_identifier>"
    completion_seq:
      - completion_noun: repository
      - completion_noun: pr
        keep_order: true
      - completion_noun: pr_check

  # ── pr_comment ───────────────────────────────────────────────────────────────

  - command: list pr_comment
    verb: list
    noun: pr_comment
    short: "List comments on a pull request: harness list pr_comment <repo_id>/<pr_number>"
    handler_type: endpoint
    requires_parentid: true
    parentid_label: "<repo_id>/<pr_number>"
    id_parts: 2
    completion_seq:
      - completion_noun: repository
      - completion_noun: pr
        keep_order: true
    endpoint:
      path: /code/api/v1/repos/{{ctx.parentIdParts[0]}}/pullreq/{{ctx.parentIdParts[1]}}/activities
      items_expr: it
      get_id_expr: string(it.id)
      query_params:
        kind: '"comment"'
        limit: flags.limit
      paging:
        paging_strategy: flat_list
      fields_extra:
        - id: short_text
          label: Short Text
          expr: truncate(it.text, 60)
          width_max: 63
      completion:
        id_expr: string(it.id)
        name_expr: 'formatOrder(it.order, it.sub_order) + " " + it.author.display_name + ": " + truncate(it.text, 40)'
        no_search_inject: true
      columns: [id, order, author, short_text, status, created]

  - command: create pr_comment
    verb: create
    noun: pr_comment
    short: "Post a comment on a pull request: harness create pr_comment <repo_id>/<pr_number> -f <file>"
    handler_type: endpoint
    requires_id: true
    id_parts: 2
    id_label: "<repo_id>/<pr_number>"
    completion_seq:
      - completion_noun: repository
      - completion_noun: pr
        keep_order: true
    flags:
      - name: file
        short: f
        description: "Comment text file, or - to read from stdin"
        required: true
      - name: reply-to
        description: Comment ID to reply to (creates a threaded reply)
    endpoint:
      method: POST
      path: /code/api/v1/repos/{{ctx.idParts[0]}}/pullreq/{{ctx.idParts[1]}}/comments
      body_fn: create_pr_comment_body
      no_fields: true
      text_header: "\nPosted comment #{{it.id}}\n"

  - command: update pr_comment
    verb: update
    noun: pr_comment
    short: "Edit a pull request comment: harness update pr_comment <repo_id>/<pr_number>/<comment_id> --set text=..."
    handler_type: endpoint
    id_parts: 3
    id_label: "<repo_id>/<pr_number>/<comment_id>"
    completion_seq:
      - completion_noun: repository
      - completion_noun: pr
        keep_order: true
      - completion_noun: pr_comment
        keep_order: true
    flags:
      - name: text
        description: New comment text
    endpoint:
      method: PATCH
      path: /code/api/v1/repos/{{ctx.idParts[0]}}/pullreq/{{ctx.idParts[1]}}/comments/{{ctx.idParts[2]}}
      body_params:
        text: flags.text
      no_fields: true
      text_header: "\nUpdated comment #{{ctx.idParts[2]}}\n"

  - command: delete pr_comment
    verb: delete
    noun: pr_comment
    confirm_mode: prompt
    short: "Delete a pull request comment: harness delete pr_comment <repo_id>/<pr_number>/<comment_id>"
    handler_type: endpoint
    id_parts: 3
    id_label: "<repo_id>/<pr_number>/<comment_id>"
    completion_seq:
      - completion_noun: repository
      - completion_noun: pr
        keep_order: true
      - completion_noun: pr_comment
        keep_order: true
    endpoint:
      method: DELETE
      path: /code/api/v1/repos/{{ctx.idParts[0]}}/pullreq/{{ctx.idParts[1]}}/comments/{{ctx.idParts[2]}}
      item_expr: it

