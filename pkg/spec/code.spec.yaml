spec_version: 1
module_type: builtin
module_desc: Harness Code repositories, pull requests, branches, commits, and tags
help_text: |
  ## Code (code)

  Harness Code is a built-in git hosting service. It provides repositories, pull
  requests, branches, commits, and tags without requiring an external git provider.

  ### Domain Model

  A repository is the top-level resource. Branches, tags, and commits live inside a
  repository. A pull request targets a repository branch and has an activity timeline
  (comments, reviews, state changes) and threaded comments associated with it.

  ### Migrating from another SCM

  To bring existing repositories, pull requests, and pipelines into Harness Code
  from GitHub, GitLab, Bitbucket, or Bitbucket Server, use the `migrate` plugin
  module rather than the commands below:

      harness get module migrate

  ### Nouns

  {{nouns}}

nouns:
  - noun: repository
    short_desc: A Harness Code source repository.
    noun_aliases: [repo, repos, repositories]
    multi_level: true
    url_path: /ng/account/{{auth.account}}/module/code/orgs/{{auth.org}}/projects/{{auth.project}}/repos/{{it.identifier}}
    fields:
      - id: identifier
        expr: it.identifier
      - id: description
        expr: it.description
        field_type: multiline_text
      - id: default_branch
        expr: it.default_branch
      - id: is_public
        expr: it.is_public
      - id: num_forks
        label: Forks
        expr: it.num_forks
        align: right
      - id: num_pulls
        label: PRs
        expr: it.num_pulls
        align: right
      - id: num_open_pulls
        label: Open PRs
        expr: it.num_open_pulls
        align: right
      - id: num_closed_pulls
        label: Closed PRs
        expr: it.num_closed_pulls
        align: right
      - id: num_merged_pulls
        label: Merged PRs
        expr: it.num_merged_pulls
        align: right
      - id: language
        expr: it.language
      - id: size
        expr: it.size
        align: right
      - id: git_url
        label: Git URL
        expr: it.git_url
      - id: url
        label: URL
        expr: url(it)
      - id: updated
        expr: epochMs(it.updated)
      - id: created
        expr: epochMs(it.created)
    ui_commands:
      - ui_command_type: text
        key: d
        label: details
        noun: repository
        default: true
      - ui_command_type: link
        key: l
        label: pull-requests
        verb: list
        noun: pr
      - ui_command_type: up
        key: "<"
        label: repo-list
        verb: list
        noun: repository

  - noun: pr
    short_desc: A Harness Code pull request.
    noun_aliases: [prs, pull_request, pull_requests]
    multi_level: true
    url_path: /ng/account/{{auth.account}}/all/code/orgs/{{auth.org}}/projects/{{auth.project}}/repos/{{ctx.idParts[0]}}/pulls/{{it.number}}/conversation
    fields:
      - id: number
        label: "#"
        expr: it.number
        align: right
      - id: title
        expr: it.title
        mutable_path: title
        width_max: 60
      - id: description
        expr: it.description
        field_type: multiline_text
        mutable_path: description
      - id: state
        expr: it.state
      - id: is_draft
        label: Draft
        expr: it.is_draft
        mutable_path: is_draft
      - id: source_branch
        label: Source Branch
        expr: it.source_branch
        mutable_path: source_branch
      - id: target_branch
        label: Target Branch
        expr: it.target_branch
        mutable_path: target_branch
      - id: author
        expr: it.author.display_name
      - id: author_email
        label: Author Email
        expr: it.author.email
      - id: author_uid
        label: Author UID
        expr: it.author.uid
      - id: merger
        expr: it.merger.display_name
      - id: merger_email
        label: Merger Email
        expr: it.merger.email
      - id: merger_uid
        label: Merger UID
        expr: it.merger.uid
      - id: reviewers
        expr: it.stats.reviews.required_count
        label: Reqd Reviews
        align: right
      - id: approvals
        expr: it.stats.reviews.latest_approvals
        align: right
      - id: merge_strategy
        expr: it.merge_method
      - id: merge_check_status
        label: Merge Check
        expr: it.merge_check_status
      - id: rebase_check_status
        label: Rebase Check
        expr: it.rebase_check_status
      - id: commits
        expr: it.stats.commits
        align: right
      - id: conversations
        expr: it.stats.conversations
        align: right
      - id: unresolved_count
        label: Unresolved
        expr: it.stats.unresolved_count
        align: right
      - id: files_changed
        label: Files Changed
        expr: it.stats.files_changed
        align: right
      - id: additions
        expr: it.stats.additions
        align: right
      - id: deletions
        expr: it.stats.deletions
        align: right
      - id: source_sha
        label: Source SHA
        expr: it.source_sha
      - id: merge_base_sha
        label: Merge Base SHA
        expr: it.merge_base_sha
      - id: created
        expr: epochMs(it.created)
      - id: edited
        expr: epochMs(it.edited)
      - id: updated
        expr: epochMs(it.updated)
      - id: merged
        expr: epochMs(it.merged)
    ui_commands:
      - ui_command_type: text
        key: d
        label: details
        noun: pr
        default: true
      - ui_command_type: text
        key: a
        label: ai-review
        noun: pr:insight
      - ui_command_type: link
        key: m
        label: commits
        verb: list
        noun: pr_commit
      - ui_command_type: text
        key: c
        label: conversation
        noun: pr:conversation
      - ui_command_type: link
        key: s
        label: checks
        verb: list
        noun: pr_check
      - ui_command_type: up
        key: "^"
        label: repo
        noun: repository
        up_id_expr: ctx.idParts[0]
      - ui_command_type: up
        key: "<"
        label: pr-list
        verb: list
        noun: pr
        up_id_expr: ctx.idParts[0]

  - noun: branch
    short_desc: A git branch in a Harness Code repository.
    noun_aliases: [branches]
    multi_level: true
    fields:
      - id: name
        expr: it.name
        mutable_path: name
      - id: target
        expr: it.sha
        mutable_path: target
      - id: sha
        expr: it.sha
      - id: sha8
        expr: substr(it.sha, 0, 8)
      - id: is_default
        label: Default
        expr: it.is_default
      - id: commit_message
        label: Last Commit
        expr: it.commit.message
      - id: author
        expr: it.commit.author.identity.name
      - id: updated
        expr: epochMs(it.commit.author.when)

  - noun: commit
    short_desc: A git commit in a Harness Code repository.
    noun_aliases: [commits]
    multi_level: true
    fields:
      - id: sha
        expr: it.sha
      - id: message
        expr: it.message
        width_max: 60
      - id: title
        expr: it.title
        width_max: 60
      - id: author
        expr: it.author.identity.name
      - id: author_email
        expr: it.author.identity.email
      - id: authored
        expr: epochMs(it.author.when)
      - id: committer
        expr: it.committer.identity.name
      - id: committer_email
        expr: it.committer.identity.email
      - id: committed
        expr: epochMs(it.committer.when)

  - noun: pr_commit
    short_desc: A commit included in a pull request (Harness Code).
    noun_aliases: [pr_commits]
    multi_level: true

  - noun: tag
    short_desc: A git tag in a Harness Code repository.
    noun_aliases: [tags]
    multi_level: true
    fields:
      - id: name
        expr: it.name
        mutable_path: name
      - id: target
        expr: it.sha
        mutable_path: target
      - id: sha
        expr: it.sha
      - id: message
        expr: it.message
        mutable_path: message

  - noun: pr_comment
    short_desc: A comment on a pull request.
    noun_aliases: [pr_comments]
    multi_level: true
    fields:
      - id: id
        label: ID
        expr: int(it.id)
      - id: order
        expr: formatOrder(it.order, it.sub_order)
        align: right
      - id: author
        expr: it.author.display_name
      - id: text
        expr: it.text
      - id: status
        expr: it.status
      - id: parent_id
        expr: int(it.parent_id)
      - id: created
        expr: epochMs(it.created)
      - id: updated
        expr: epochMs(it.updated)

  - noun: commit_check
    short_desc: A status check result on a specific commit (full history, not just the current PR head).
    noun_aliases: [commit_checks]
    multi_level: true
    fields:
      - id: identifier
        expr: it.identifier
      - id: status
        expr: spaceAfter(statusIcon(it.status)) + it.status
      - id: summary
        expr: it.summary
        width_max: 60
      - id: link
        expr: it.link
      - id: reported_by
        label: Reported By
        expr: it.reported_by.display_name
      - id: reported_by_email
        label: Reported By Email
        expr: it.reported_by.email
      - id: reported_by_uid
        label: Reported By UID
        expr: it.reported_by.uid
      - id: started
        expr: epochMs(it.started)
      - id: ended
        expr: epochMs(it.ended)
      - id: duration
        expr: duration(it.started, it.ended)
        align: right
      - id: created
        expr: epochMs(it.created)
      - id: updated
        expr: epochMs(it.updated)
      - id: payload_kind
        label: Payload Kind
        expr: it.payload.kind

  - noun: pr_check
    short_desc: A status check on a pull request (CI, required checks, etc).
    noun_aliases: [pr_checks]
    multi_level: true
    fields:
      - id: identifier
        expr: it.check.identifier
      - id: status
        expr: spaceAfter(statusIcon(it.check.status)) + it.check.status
      - id: required
        expr: it.required
      - id: summary
        expr: it.check.summary
        width_max: 60
      - id: link
        expr: it.check.link
      - id: reported_by
        label: Reported By
        expr: it.check.reported_by.display_name
      - id: reported_by_email
        label: Reported By Email
        expr: it.check.reported_by.email
      - id: reported_by_uid
        label: Reported By UID
        expr: it.check.reported_by.uid
      - id: started
        expr: epochMs(it.check.started)
      - id: ended
        expr: epochMs(it.check.ended)
      - id: duration
        expr: duration(it.check.started, it.check.ended)
        align: right
      - id: created
        expr: epochMs(it.check.created)
      - id: updated
        expr: epochMs(it.check.updated)
      - id: bypassable
        expr: it.bypassable
      - id: payload_kind
        label: Payload Kind
        expr: it.check.payload.kind
      - id: pipeline_id
        label: Pipeline
        expr: it.check.payload.data.pipeline_identifier
      - id: pipeline_org
        label: Pipeline Org
        expr: it.check.payload.data.org_identifier
      - id: pipeline_project
        label: Pipeline Project
        expr: it.check.payload.data.project_identifier
      - id: execution_id
        label: Execution ID
        expr: it.check.payload.data.execution_id
      - id: stage_id
        label: Stage ID
        expr: it.check.payload.data.stage_identifier
    ui_commands:
      - ui_command_type: text
        key: d
        label: details
        noun: pr_check
        default: true
      - ui_command_type: text
        key: g
        label: check-logs
        noun: pr_check:log
      - ui_command_type: up
        key: "^"
        label: pull-request
        noun: pr
        up_id_expr: ctx.idParts[0] + "/" + ctx.idParts[1]
      - ui_command_type: up
        key: "e"
        label: execution
        noun: execution
        up_id_expr: it.check.payload.data.pipeline_identifier + "/" + it.check.payload.data.execution_id

  - noun: pr_check_log
    short_desc: A snapshot of a PR check's backing pipeline stage logs.
    fields:
      - id: logs
        expr: it.logs
        field_type: multiline_text

  - noun: pr_insight
    short_desc: Risk summary for a pull request (Harness Code review insights).
    noun_aliases: [pr_insights]
    url_path: /ng/account/{{auth.account}}/all/code/orgs/{{auth.org}}/projects/{{auth.project}}/repos/{{ctx.idParts[0]}}/pulls/{{ctx.idParts[1]}}/conversation
    fields:
      - id: risk
        expr: it.risk
      - id: content
        expr: it.content
        field_type: multiline_text

  - noun: pr_review_group
    short_desc: Risk-bucketed groups of changed files on a pull request (Harness Code review insights).
    noun_aliases: [pr_review_groups]
    url_path: /ng/account/{{auth.account}}/all/code/orgs/{{auth.org}}/projects/{{auth.project}}/repos/{{ctx.idParts[0]}}/pulls/{{ctx.idParts[1]}}/conversation

  - noun: pr_reviewer
    short_desc: A reviewer on a pull request, with their review decision (Harness Code).
    noun_aliases: [pr_reviewers]
    fields:
      - id: id
        label: Id
        expr: it.reviewer.id
      - id: display_name
        label: Display Name
        expr: it.reviewer.display_name
      - id: email
        expr: it.reviewer.email
      - id: uid
        expr: it.reviewer.uid
      - id: decision
        expr: it.review_decision
      - id: type
        expr: it.type
      - id: added_by
        label: Added By
        expr: it.added_by.display_name
      - id: updated
        expr: epochMs(it.updated)

  - noun: pr_codeowner
    short_desc: A codeowner (individual or group member) evaluated against a pull request (Harness Code).
    noun_aliases: [pr_codeowners]
    fields:
      - id: pattern
        expr: it.pattern
      - id: owner_type
        label: Owner Type
        expr: it.owner_type
      - id: display_name
        label: Display Name
        expr: it.display_name
      - id: email
        expr: it.email
      - id: group_name
        label: Group
        expr: it.group_name
      - id: decision
        expr: it.review_decision

  - noun: pr_label
    short_desc: A label assignable to a pull request (Harness Code).
    noun_aliases: [pr_labels]
    fields:
      - id: id
        expr: it.id
      - id: key
        expr: prLabelColor(it.color, it.key)
      - id: type
        expr: it.type
      - id: assigned
        expr: it.assigned
      - id: color
        expr: it.color

  - noun: repo_label
    short_desc: A label defined at the repo level, assignable to pull requests (Harness Code).
    noun_aliases: [repo_labels]
    fields:
      - id: id
        expr: it.id
      - id: key
        expr: prLabelColor(it.color, it.key)
      - id: type
        expr: it.type
      - id: description
        expr: it.description
      - id: value_count
        label: Values
        expr: it.value_count
        align: right
      - id: pullreq_count
        label: PRs Using
        expr: it.pullreq_count
        align: right
      - id: created
        expr: epochMs(it.created)
      - id: updated
        expr: epochMs(it.updated)

  - noun: code_principal
    short_desc: A person or service account in the current account/org/project scope (Harness Code).
    noun_aliases: [code_principals]
    fields:
      - id: id
        expr: it.id
      - id: display_name
        label: Display Name
        expr: it.display_name
      - id: email
        expr: it.email
      - id: uid
        expr: it.uid
      - id: type
        expr: it.type

  - noun: pr_suggested_reviewer
    short_desc: A suggested reviewer for a pull request (Harness Code review insights).
    noun_aliases: [pr_suggested_reviewers]
    fields:
      - id: display_name
        label: Display Name
        expr: it.reviewer.display_name
      - id: email
        expr: it.reviewer.email
      - id: uid
        expr: it.reviewer.uid
      - id: suggested_by
        label: Suggested By
        expr: it.suggested_by.display_name
      - id: suggested_at
        label: Suggested At
        expr: epochMs(it.suggested_at)

  - noun: pr_suggested_label
    short_desc: A suggested label for a pull request (Harness Code review insights).
    noun_aliases: [pr_suggested_labels]
    fields:
      - id: key
        expr: it.label.key
      - id: color
        expr: it.label.color
      - id: type
        expr: it.label.type
      - id: suggested_by
        label: Suggested By
        expr: it.suggested_by.display_name
      - id: suggested
        label: Suggested At
        expr: epochMs(it.suggested)

  - noun: pr_success_criterion
    short_desc: An AI review success-criterion result for a pull request (Harness Code review insights).
    noun_aliases: [pr_success_criteria]
    fields:
      - id: id
        label: ID
        expr: it.id
      - id: status
        expr: it.status
      - id: summary
        expr: it.summary
      - id: started
        expr: epochMs(it.started)
      - id: ended
        expr: epochMs(it.ended)

  - noun: pr_activity
    short_desc: Activity timeline entry on a pull request (comments, reviews, state changes).
    noun_aliases: [pr_activities]
    multi_level: true
    url_path: /ng/account/{{auth.account}}/all/code/orgs/{{auth.org}}/projects/{{auth.project}}/repos/{{ctx.idParts[0]}}/pulls/{{ctx.idParts[1]}}/conversation
    fields:
      - id: id
        label: ID
        expr: int(it.id)
      - id: kind
        expr: it.kind
      - id: type
        expr: it.type
      - id: author
        expr: it.author.display_name
      - id: author_email
        expr: it.author.email
      - id: text
        expr: it.text
        width_max: 80
      - id: order
        expr: it.order
        align: right
      - id: created
        expr: epochMs(it.created)
      - id: edited
        expr: epochMs(it.edited)

commands:
  # ── repository ──────────────────────────────────────────────────────────────

  - command: list repository
    verb: list
    noun: repository
    short: List code repositories
    handler_type: endpoint
    flags:
      - name: search
        description: Filter by name or keyword
    endpoint:
      path: /code/api/v1/repos
      items_expr: it
      get_id_expr: it.identifier
      query_params:
        query: flags.search
        page: flags.page
        limit: flags.limit
      paging:
        paging_strategy: page_header
        countable: false
        page_index_param: page
        page_size_param: limit
        page_size_default: 30
        page_size_max: 100
        page_base: 1
      completion:
        id_expr: it.identifier
        name_expr: it.identifier
      columns: [identifier, default_branch, num_open_pulls, updated]

  - command: get repository
    verb: get
    noun: repository
    short: Get repository details
    handler_type: endpoint
    endpoint:
      path: /code/api/v1/repos/{{ctx.id}}
      item_expr: it
      yaml_pick_expr: it

  - command: create repository
    verb: create
    noun: repository
    short: "Create a new repository: --set identifier=<name> [default_branch=main] [description=...] [is_public=true]"
    handler_type: endpoint
    endpoint:
      method: POST
      path: /code/api/v1/repos
      create_strategy: set-fields
      create_body_init:
        identifier: ctx.id
        default_branch: '"main"'
      create_body_wrap: ""
      text_header: "\nCreated repository {{it.identifier}}\n"
      text_footer: "{{url(it)}}\n"

  - command: update repository
    verb: update
    noun: repository
    short: Update a repository (description, default_branch, is_public)
    handler_type: endpoint
    flags_builtin:
      set: true
      del: true
    endpoint:
      method: PATCH
      path: /code/api/v1/repos/{{ctx.id}}
      update_strategy: get-then-patch
      update_body_pick: it
      no_fields: true
      text_header: "\nUpdated repository {{ctx.id}}\n"

  - command: pull repository
    verb: pull
    noun: repository
    short: "Clone a repository: harness pull repository <repo_id> [<dest-dir>]"
    handler_type: workflow
    workflow_id: pull_repository
    has_args: true
    args_label: "[<dest-dir>]"
    completion_seq:
      - completion_noun: repository

  # ── pr ──────────────────────────────────────────────────────────────────────

  - command: list pr:mine
    verb: list
    noun: pr
    noun_variant: mine
    short: "List pull requests you authored, across all repos: harness list pr:mine [--state open|closed|merged|all]"
    handler_type: endpoint
    flags:
      - name: state
        description: "Filter by state: open, closed, merged, all"
        default: open
        completion_values: [open, closed, merged, all]
      - name: created-after
        description: "Show PRs created after this date (YYYY-MM-DD in local time, relative like 30d/2w/1m (m=month), or epoch ms)"
      - name: created-before
        description: "Show PRs created before this date (YYYY-MM-DD in local time, relative like 30d/2w/1m (m=month), or epoch ms)"
    endpoint:
      path: /code/api/v1/pullreq
      query_params_fn: list_mine_pr_query_params
      fetch_fn: list_mine_pr_fetch
      items_expr: it
      get_id_expr: it.repository.identifier + "/" + string(it.number)
      query_params:
        state: 'flags.state == "all" ? "" : flags.state'
        created_gt: 'parseDateMs(flags["created-after"])'
        created_lt: 'parseDateMs(flags["created-before"])'
        page: flags.page
        limit: flags.limit
      paging:
        paging_strategy: page_header
        countable: false
        page_index_param: page
        page_size_param: limit
        page_size_default: 30
        page_size_max: 100
        page_base: 1
      fields_extra:
        - id: repo
          label: Repo
          expr: it.repository.identifier
        - id: url
          label: URL
          expr: auth.ui_url + "/ng/account/" + auth.account + "/all/code/orgs/" + auth.org + "/projects/" + auth.project + "/repos/" + it.repository.identifier + "/pulls/" + string(it.number) + "/conversation"
      columns: [repo, number, title, state, source_branch, target_branch, updated]

  - command: list pr:review_pending
    verb: list
    noun: pr
    noun_variant: review_pending
    short: "List pull requests awaiting your review, across all repos: harness list pr:review_pending [--state open|closed|merged|all]"
    handler_type: endpoint
    flags:
      - name: state
        description: "Filter by state: open, closed, merged, all"
        default: open
        completion_values: [open, closed, merged, all]
      - name: created-after
        description: "Show PRs created after this date (YYYY-MM-DD in local time, relative like 30d/2w/1m (m=month), or epoch ms)"
      - name: created-before
        description: "Show PRs created before this date (YYYY-MM-DD in local time, relative like 30d/2w/1m (m=month), or epoch ms)"
    endpoint:
      path: /code/api/v1/pullreq
      query_params_fn: review_pending_pr_query_params
      fetch_fn: list_mine_pr_fetch
      items_expr: it
      get_id_expr: it.repository.identifier + "/" + string(it.number)
      query_params:
        state: 'flags.state == "all" ? "" : flags.state'
        created_gt: 'parseDateMs(flags["created-after"])'
        created_lt: 'parseDateMs(flags["created-before"])'
        page: flags.page
        limit: flags.limit
      paging:
        paging_strategy: page_header
        countable: false
        page_index_param: page
        page_size_param: limit
        page_size_default: 30
        page_size_max: 100
        page_base: 1
      fields_extra:
        - id: repo
          label: Repo
          expr: it.repository.identifier
        - id: url
          label: URL
          expr: auth.ui_url + "/ng/account/" + auth.account + "/all/code/orgs/" + auth.org + "/projects/" + auth.project + "/repos/" + it.repository.identifier + "/pulls/" + string(it.number) + "/conversation"
      columns: [repo, number, title, state, source_branch, target_branch, updated]

  - command: list pr
    verb: list
    noun: pr
    short: "List pull requests for a repository: harness list pr <repo_id> [--state open|closed|merged|all] [--author <id>] [--created-after <date>]"
    handler_type: endpoint
    requires_parentid: true
    parentid_label: "<repo_id>"
    completion_noun: repository
    flags:
      - name: state
        description: "Filter by state: open, closed, merged, all"
        default: open
        completion_values: [open, closed, merged, all]
      - name: search
        description: Filter by keyword
      - name: author
        description: "Filter by author (email, UUID, or numeric principal ID)"
        flag_resolve_fn: resolve_principal_id
      - name: created-after
        description: "Show PRs created after this date (YYYY-MM-DD in local time, relative like 30d/2w/1m (m=month), or epoch ms)"
      - name: created-before
        description: "Show PRs created before this date (YYYY-MM-DD in local time, relative like 30d/2w/1m (m=month), or epoch ms)"
      - name: sort
        description: "Sort field: number, created, updated, edited, merged"
        default: number
        completion_values: [number, created, updated, edited, merged]
      - name: order
        description: "Sort direction: asc, desc"
        default: desc
        completion_values: [asc, desc]
    endpoint:
      path: /code/api/v1/repos/{{ctx.parentId}}/pullreq
      items_expr: it
      get_id_expr: ctx.parentId + "/" + string(it.number)
      query_params:
        state: 'flags.state == "all" ? "" : flags.state'
        query: flags.search
        created_by: flags.author
        created_gt: 'parseDateMs(flags["created-after"])'
        created_lt: 'parseDateMs(flags["created-before"])'
        sort: 'flags.sort == "number" ? "" : flags.sort'
        order: 'flags.order == "desc" ? "" : flags.order'
        page: flags.page
        limit: flags.limit
      paging:
        paging_strategy: page_header
        countable: false
        page_index_param: page
        page_size_param: limit
        page_size_default: 30
        page_size_max: 100
        page_base: 1
      completion:
        id_expr: string(it.number)
        name_expr: '"#" + string(it.number) + " " + it.title'
        no_search_inject: true
      columns: [number, title, state, source_branch, target_branch, author, updated]

  - command: get pr
    verb: get
    noun: pr
    short: "Get pull request details: harness get pr <repo_id>/<pr_number>"
    handler_type: workflow
    workflow_id: get_pr
    id_parts: 2
    completion_seq:
      - completion_noun: repository
      - completion_noun: pr
        keep_order: true
    endpoint:
      path: /code/api/v1/repos/{{ctx.idParts[0]}}/pullreq/{{ctx.idParts[1]}}
