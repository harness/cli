  - command: list agent
    verb: list
    noun: agent
    short: List AI agents
    flags_builtin:
    handler_type: endpoint
    endpoint:
      path: /gateway/agents/api/v1/agents
      items_expr: it
      get_id_expr: it.id
      columns: [id, name, role, status, version]
      completion:
        id_expr: it.id
        name_expr: it.name
      paging:
        paging_strategy: flat_list

  - command: get agent
    verb: get
    noun: agent
    short: Get an AI agent by identifier
    completion_noun: agent
    flags_builtin:
    handler_type: endpoint
    endpoint:
      path: /gateway/agents/api/v1/agents/{{ctx.id}}
      item_expr: it
      yaml_pick_expr: it
      yaml_exclude: [id, status, role, version, created_at, updated_at, created_by]
      query_params:
        accountIdentifier: auth.account
        orgIdentifier: auth.org
        projectIdentifier: auth.project

  - command: create agent
    verb: create
    noun: agent
    requires_id: true
    short: "Create an AI agent: harness create agent <id> -f agent.yaml"
    long: |
      Create an AI agent from a wrapper YAML file.

      The -f file is the agent wrapper (name, description, spec, ...) — not the agent spec YAML
      itself. The agent spec (the pipeline-like YAML with stages, steps, inputs, etc.) lives as a
      string under the "spec" key inside the wrapper. Use 'harness get agent <id> -o yaml' to
      produce a valid wrapper file to use as a starting point.
    handler_type: endpoint
    endpoint:
      method: POST
      file_body: required
      path: /gateway/agents/api/v1/agents
      create_strategy: set-fields
      create_body_init:
        uid: ctx.id
        name: ctx.id
      item_expr: it
      text_header: "\nCreated agent {{it.id}}\n"
      query_params:
        accountIdentifier: auth.account
        orgIdentifier: auth.org
        projectIdentifier: auth.project

  - command: update agent
    verb: update
    noun: agent
    short: "Update an AI agent: harness update agent <id> -f agent.yaml"
    long: |
      Update an AI agent from a wrapper YAML file.

      The -f file is the agent wrapper (name, description, spec, ...) — not the agent spec YAML
      itself. The agent spec (the pipeline-like YAML with stages, steps, inputs, etc.) lives as a
      string under the "spec" key inside the wrapper. Use 'harness get agent <id> -o yaml' to
      produce a valid wrapper file to edit and re-apply.
    completion_noun: agent
    handler_type: endpoint
    endpoint:
      method: PUT
      file_body: required
      path: /gateway/agents/api/v1/agents/{{ctx.id}}
      item_expr: it
      text_header: "\nUpdated agent {{ctx.id}}\n"
      query_params:
        accountIdentifier: auth.account
        orgIdentifier: auth.org
        projectIdentifier: auth.project

  - command: delete agent
    verb: delete
    noun: agent
    confirm_mode: prompt
    short: Delete a custom AI agent
    completion_noun: agent
    handler_type: endpoint
    endpoint:
      method: DELETE
      path: /gateway/agents/api/v1/agents/{{ctx.id}}
      query_params:
        accountIdentifier: auth.account
        orgIdentifier: auth.org
        projectIdentifier: auth.project

  - command: get account
    verb: get
    noun: account
    no_id: true
    short: Get the current account details
    handler_type: endpoint
    endpoint:
      path: /ng/api/accounts/{{auth.account}}
      item_expr: it.data
      yaml_pick_expr: it.data
