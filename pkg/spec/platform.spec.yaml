spec_version: 1
module_type: builtin
module_desc: Core platform resources (orgs, projects, users, connectors, delegates)
help_text: |
  ## Platform (platform)

  The Platform module covers account-level and organizational resources that are shared
  across all Harness modules. This includes the identity hierarchy, access control, and
  the connectors and secrets that other modules depend on.

  ### Domain Model

  The scope hierarchy is: account → organization → project. Most resources live at one
  level of this hierarchy and inherit settings from above.

  Access control is: user (or service_account or user_group) + role + resource_group →
  role_assignment. A role bundles permissions; a resource_group scopes which resources
  the role applies to.

  Connectors and secrets are declared at any scope level and referenced by pipelines and
  other resources. Delegates are agents that run in your infrastructure and execute tasks
  on behalf of Harness.

  ### Nouns

  {{nouns}}

nouns:
  - noun: account
    short_desc: The top-level Harness account entity with billing, auth, and cluster configuration.
    noun_aliases: [accounts]
    fields:
      - id: identifier
        expr: it.identifier
      - id: name
        expr: it.name
      - id: company
        expr: it.companyName
      - id: type
        expr: it.accountType
      - id: status
        expr: it.accountStatus
      - id: edition
        expr: it.edition
      - id: auth
        expr: it.authenticationMechanism
      - id: default_experience
        expr: it.defaultExperience
      - id: cluster
        expr: it.cluster
      - id: ring
        expr: it.ringName
      - id: subdomain_url
        label: Subdomain URL
        expr: it.subdomainURL
      - id: product_led
        expr: it.productLed
      - id: public_access
        expr: it.publicAccessEnabled
      - id: oauth_enabled
        expr: it.oauthEnabled
      - id: 2fa_enforced
        label: 2FA Enforced
        expr: it.twoFactorAdminEnforced
      - id: cross_gen_access
        expr: it.crossGenerationAccessEnabled
      - id: harness_support_access
        expr: it.harnessSupportAccessAllowed
      - id: session_timeout_mins
        expr: it.sessionTimeoutInMinutes
      - id: abs_session_timeout_mins
        expr: it.absoluteSessionTimeoutInMinutes
      - id: created_at
        expr: epochMs(it.createdAt)
        field_type: ts
      - id: expiry
        expr: epochMs(it.expiryTime)
        field_type: ts

  - noun: organization
    short_desc: A top-level organizational unit that groups projects within an account.
    noun_aliases: [org, orgs, organizations]
    fields:
      - id: identifier
        expr: it.identifier
      - id: name
        expr: it.name
        mutable_path: name
      - id: description
        expr: it.description
        mutable_path: description
      - id: tags
        expr: formatTagDisplay(it.tags)
        field_type: tags
        mutable_path: tags

  - noun: project
    short_desc: A scoped workspace within an org where pipelines, connectors, and secrets live.
    noun_aliases: [projects]
    multi_level: true
    url_path: /ng/account/{{auth.account}}/all/orgs/{{it.project.orgIdentifier}}/projects/{{it.project.identifier}}/overview
    fields:
      - id: identifier
        expr: it.project.identifier
      - id: name
        expr: it.project.name
        mutable_path: name
      - id: org
        expr: it.project.orgIdentifier
      - id: description
        expr: it.project.description
        mutable_path: description
      - id: color
        expr: it.project.color
        mutable_path: color
      - id: tags
        expr: formatTagDisplay(it.project.tags)
        field_type: tags
        mutable_path: tags
      - id: modules
        expr: jsonArray(it.project.modules)
        field_type: set
        mutable_path: modules
      - id: created_at
        expr: epochMs(it.createdAt)
        field_type: ts
      - id: updated_at
        expr: epochMs(it.lastModifiedAt)
        field_type: ts
      - id: favorite
        expr: it.isFavorite
      - id: last_moved_at
        expr: epochMs(it.lastMovedAt)
        field_type: ts
      - id: url
        label: URL
        expr: url(it)

  - noun: user
    short_desc: A Harness user account with roles, 2FA state, and lock/disable status.
    noun_aliases: [users]
    multi_level: true
    fields:
      - id: uuid
        label: UUID
        expr: it.user.uuid
      - id: name
        expr: it.user.name
      - id: email
        expr: it.user.email
      - id: roles
        expr: formatRoleAssignments(it.roleAssignmentMetadata)
      - id: role_ids
        label: Role IDs
        expr: formatRoleIds(it.roleAssignmentMetadata)
      - id: disabled
        expr: it.user.disabled
      - id: locked
        expr: it.user.locked
      - id: 2fa
        label: 2FA
        expr: it.user.twoFactorAuthenticationEnabled
      - id: externally_managed
        expr: it.user.externallyManaged

  - noun: user_group
    short_desc: A named group of users used to assign roles and SSO mappings in bulk.
    noun_aliases: [user_groups]
    multi_level: true
    fields:
      - id: identifier
        expr: it.identifier
      - id: name
        expr: it.name
        mutable_path: name
      - id: description
        expr: it.description
        mutable_path: description
      - id: tags
        expr: formatTagDisplay(it.tags)
        field_type: tags
        mutable_path: tags
      - id: users
        expr: jsonArray(it.users)
        field_type: set
        mutable_path: users
      - id: org
        expr: it.orgIdentifier
      - id: project
        expr: it.projectIdentifier
      - id: sso_linked
        expr: it.ssoLinked
      - id: externally_managed
        expr: it.externallyManaged
      - id: harness_managed
        expr: it.harnessManaged

  - noun: service_account
    short_desc: A non-human identity used by applications or pipelines to authenticate with Harness.
    noun_aliases: [service_accounts]
    multi_level: true
    fields:
      - id: identifier
        expr: it.identifier
      - id: name
        expr: it.name
        mutable_path: name
      - id: email
        expr: it.email
        mutable_path: email
      - id: description
        expr: it.description
        mutable_path: description
      - id: tags
        expr: formatTagDisplay(it.tags)
        field_type: tags
        mutable_path: tags
      - id: org_id
        expr: it.orgIdentifier
      - id: project_id
        expr: it.projectIdentifier

  - noun: role
    short_desc: A named set of permissions that can be assigned to users or groups.
    noun_aliases: [roles]
    multi_level: true
    fields:
      - id: identifier
        expr: it.role.identifier
      - id: name
        expr: it.role.name
        mutable_path: name
      - id: description
        expr: it.role.description
        mutable_path: description
      - id: scopes
        expr: jsonArray(it.role.allowedScopeLevels)
        field_type: set
        mutable_path: allowedScopeLevels
      - id: permissions
        expr: jsonArray(it.role.permissions)
        field_type: set
        width_max: 60
        mutable_path: permissions
      - id: harness_managed
        expr: it.harnessManaged
      - id: created_at
        expr: epochMs(it.createdAt)
        field_type: ts
      - id: updated_at
        expr: epochMs(it.lastModifiedAt)
        field_type: ts

  - noun: role_assignment
    short_desc: A binding that grants a role and resource group to a principal (user, group, or service account).
    noun_aliases: [role_assignments]
    multi_level: true
    fields:
      - id: identifier
        expr: it.roleAssignment.identifier
      - id: role
        expr: it.roleAssignment.roleIdentifier
      - id: resource_group
        expr: it.roleAssignment.resourceGroupIdentifier
      - id: principal
        expr: it.roleAssignment.principal.identifier
      - id: principal_type
        expr: it.roleAssignment.principal.type
      - id: disabled
        expr: it.roleAssignment.disabled
      - id: managed
        expr: it.roleAssignment.managed
      - id: harness_managed
        expr: it.harnessManaged
      - id: created_at
        expr: epochMs(it.createdAt)
        field_type: ts
      - id: updated_at
        expr: epochMs(it.lastModifiedAt)
        field_type: ts

  - noun: resource_group
    short_desc: A collection of resources (pipelines, connectors, etc.) that scopes a role assignment.
    noun_aliases: [resource_groups]
    multi_level: true
    fields:
      - id: identifier
        expr: it.resourceGroup.identifier
      - id: name
        expr: it.resourceGroup.name
        mutable_path: name
      - id: description
        expr: it.resourceGroup.description
        mutable_path: description
      - id: harness_managed
        expr: it.harnessManaged
      - id: allowed_scope_levels
        expr: jsonArray(it.resourceGroup.allowedScopeLevels)
      - id: created_at
        expr: epochMs(it.createdAt)
        field_type: ts
      - id: updated_at
        expr: epochMs(it.lastModifiedAt)
        field_type: ts

  - noun: permission
    short_desc: A granular action allowed on a resource type, used to build roles.
    noun_aliases: [permissions]
    fields:
      - id: identifier
        expr: it.permission.identifier
      - id: name
        expr: it.permission.name
      - id: resource_type
        expr: it.permission.resourceType
      - id: action
        expr: it.permission.action
      - id: status
        expr: it.permission.status
      - id: include_in_all_roles
        expr: it.permission.includeInAllRoles
      - id: allowed_scope_levels
        expr: jsonArray(it.permission.allowedScopeLevels)

  - noun: setting
    short_desc: A configurable platform option with a value, type, and inheritance scope.
    noun_aliases: [settings]
    multi_level: true
    fields:
      - id: identifier
        expr: it.setting.identifier
      - id: name
        expr: it.setting.name
      - id: value
        expr: it.setting.value
      - id: default
        expr: it.setting.defaultValue
      - id: source
        expr: it.setting.settingSource
      - id: editable
        expr: it.setting.isSettingEditable
      - id: allow_overrides
        expr: it.setting.allowOverrides
      - id: value_type
        expr: it.setting.valueType
      - id: allowed_values
        expr: jsonArray(it.setting.allowedValues)
      - id: allowed_scopes
        expr: jsonArray(it.setting.allowedScopes)
      - id: updated
        expr: epochMs(it.lastModifiedAt)

  - noun: setting_value
    short_desc: The current effective value of a setting after scope resolution.
    fields:
      - id: value
        expr: it.value
      - id: value_type
        expr: it.valueType

  - noun: connector
    short_desc: An integration that connects Harness to an external service (cloud, repo, registry, etc.).
    noun_aliases: [connectors]
    multi_level: true
    fields:
      - id: identifier
        expr: it.connector.identifier
      - id: name
        expr: it.connector.name
        mutable_path: name
      - id: type
        expr: it.connector.type
      - id: description
        expr: it.connector.description
        mutable_path: description
      - id: status
        expr: it.status.status
      - id: last_connected_at
        label: Last Connected
        expr: epochMs(it.status.lastConnectedAt)
        field_type: ts

  - noun: connector_test
    short_desc: Result of a connector connectivity test.
    fields:
      - id: status
        expr: it.status
      - id: errorSummary
        label: Error Summary
        expr: it.errorSummary

  - noun: entity_usage
    short_desc: An entity (pipeline, template, etc.) that references another entity such as a connector.
    noun_aliases: [entity_usages]
    multi_level: true
    fields:
      - id: type
        expr: it.referredByEntity.type
      - id: name
        expr: it.referredByEntity.name
      - id: identifier
        expr: it.referredByEntity.entityRef.identifier
      - id: org
        expr: it.referredByEntity.entityRef.orgIdentifier
      - id: project
        expr: it.referredByEntity.entityRef.projectIdentifier
      - id: created_at
        expr: epochMs(it.createdAt)
        field_type: ts

  - noun: agent
    short_desc: An AI agent definition.
    noun_aliases: [agents]
    fields:
      - id: id
        expr: it.id
      - id: name
        expr: it.name
      - id: role
        expr: it.role
      - id: status
        expr: it.status
      - id: version
        expr: it.version
      - id: description
        expr: it.description
      - id: created_at
        label: Created
        expr: it.created_at
      - id: updated_at
        label: Updated
        expr: it.updated_at
      - id: created_by
        label: Created By
        expr: it.created_by.name
      - id: created_by_email
        label: Created By Email
        expr: it.created_by.email
      - id: spec
        expr: it.spec
        field_type: multiline_text

  - noun: delegate
    short_desc: An agent installed in your infrastructure that executes pipeline tasks on Harness's behalf.
    noun_aliases: [delegates]
    multi_level: true
    fields:
      - id: identifier
        expr: it.delegateGroupIdentifier
      - id: name
        expr: it.groupName
      - id: type
        expr: it.delegateType
      - id: status
        expr: it.connectivityStatus
      - id: version
        expr: it.activelyConnected

  - noun: connector_catalogue
    short_desc: Connector types available in the account, grouped by category.
    noun_aliases: [connector_catalogues]
    fields:
      - id: category
        expr: it.category
      - id: connectors
        expr: jsonArray(it.connectors)
        width_max: 100

  - noun: llm_model
    short_desc: A model offered by an LLM provider, discovered for draft connector authentication.
    noun_aliases: [llm_models]
    fields:
      - id: value
        expr: it.value
      - id: name
        expr: it.displayName

  - noun: delegate_token
    short_desc: An authentication token used by delegates to connect to Harness.
    noun_aliases: [delegate_tokens]
    fields:
      - id: name
        expr: it.name
      - id: status
        expr: it.status
      - id: created_at
        label: Created
        expr: epochMs(it.createdAt)
      - id: created_by
        label: Created By
        expr: it.createdByNgUser.name

  - noun: secret
    short_desc: An encrypted credential or sensitive value stored in a secrets manager.
    noun_aliases: [secrets]
    multi_level: true
    fields:
      - id: identifier
        expr: it.secret.identifier
      - id: name
        expr: it.secret.name
        mutable_path: name
      - id: type
        expr: it.secret.type
      - id: secret_manager
        expr: it.secret.spec.secretManagerIdentifier
        mutable_path: spec.secretManagerIdentifier
      - id: value
        expr: it.secret.spec.value
        mutable_path: spec.value
      - id: updated
        expr: epochMs(it.updatedAt)
      - id: created
        expr: epochMs(it.createdAt)

commands:
  - command: migrate project:project
    verb: migrate
    noun: project
    noun_to: project
    short: "Copy a project's CD core into another project in the same org"
    long: |
      Copy project-scoped CD configuration from --from to --to in one org.
      The destination project is created when it does not already exist.
      Identical destination resources are skipped. Differing destination
      content aborts the copy before any write.

      --resources takes a comma-separated list of groups. cd-core copies
      secrets, connectors, services, environments, infrastructures, service
      overrides, templates, pipelines, input sets, triggers, policies, and
      policy sets. Secret-manager connectors are copied before the reference
      secrets that name them. Triggers are created disabled. Git-backed
      entities are skipped. Org and account references are reported and left
      in place. Delegate selectors are checked against connected account
      delegates; delegates are not copied.

      Inline SecretText values are not read or written. The report lists each
      inline secret that needs a value; create it in the destination before
      use. Reference secrets copy their manager and path. Other secret types
      are blocked. The default is a plan; pass --apply to write.
      Reports support text/JSON and --out to a NEW file only.
    handler_type: workflow
    workflow_id: project_copy
    migrate_from:
      presence: required
      label: Source project identifier
    migrate_to:
      presence: required
      label: Destination project identifier
    flags:
      - name: resources
        required: true
        description: "Comma-separated resource groups to copy. Supported: cd-core"
      - name: dry-run
        is_bool: true
        description: "Plan only. This is the default."
      - name: apply
        is_bool: true
        description: "Create the destination project if needed and copy resources"

  - command: list organization
    verb: list
    noun: organization
    short: List organizations in the account
    handler_type: endpoint
    flags:
      - name: search
        description: Filter organizations by name or ID
    endpoint:
      path: /ng/api/organizations
      items_expr: it.data.content
      item_item_expr: it.organization
      columns: [identifier, name]
      get_id_expr: it.organization.identifier
      completion:
        id_expr: it.organization.identifier
        name_expr: it.organization.name
      query_params:
        searchTerm: flags.search
      paging:
        paging_strategy: page_index
        countable: true
        page_index_param: pageIndex
        page_size_param: pageSize
        page_size_default: 50
        page_size_max: 100
        total_expr: it.data.totalItems

  - command: get organization
    verb: get
    noun: organization
    short: Get an organization by identifier
    flags_builtin:
      ui: true
    handler_type: endpoint
    endpoint:
      path: /ng/api/organizations/{{ctx.id}}
      item_expr: it.data.organization
      yaml_pick_expr: it.data.organization

  - command: update organization
    verb: update
    noun: organization
    short: Update an organization
    flags_builtin:
      set: true
      del: true
    handler_type: endpoint
    endpoint:
      method: PUT
      file_body: optional
      path: /ng/api/organizations/{{ctx.id}}
      item_expr: it.data.organization
      update_strategy: get-then-put
      update_body_pick: it.data.organization
      update_body_wrap: organization
      query_params:
        accountIdentifier: auth.account

  - command: create organization
    verb: create
    noun: organization
    requires_id: true
    short: Create a new organization
    flags_builtin:
      set: true
    handler_type: endpoint
    endpoint:
      method: POST
      file_body: optional
      path: /ng/api/organizations
      item_expr: it.data.organization
      create_strategy: set-fields
      create_body_init:
        identifier: ctx.id
        name: coalesce(ctx.setArgs.name, ctx.id)
      create_body_wrap: organization
      query_params:
        accountIdentifier: auth.account

  - command: delete organization
    verb: delete
    noun: organization
    confirm_mode: confirm_id
    short: Delete an organization by identifier
    handler_type: endpoint
    endpoint:
      method: DELETE
      path: /ng/api/organizations/{{ctx.id}}
      item_expr: it
      text_header: "\nDeleted organization {{ctx.id}}\n"
      query_params:
        accountIdentifier: auth.account

  - command: list project
    verb: list
    noun: project
    short: List projects in an organization
    flags_builtin:
    handler_type: endpoint
    flags:
      - name: search
        description: Filter projects by name
    endpoint:
      path: /ng/api/projects
      items_expr: it.data.content
      get_id_expr: it.project.identifier
      fields_subset:
        [
          identifier,
          name,
          org,
          description,
          color,
          modules,
          tags,
          created_at,
          updated_at,
          last_moved_at,
          favorite,
          url,
        ]
      columns: [identifier, name, org]
      completion:
        id_expr: it.project.identifier
        name_expr: it.project.name
      query_params:
        searchTerm: flags.search
      paging:
        paging_strategy: page_index
        countable: true
        page_index_param: pageIndex
        page_size_param: pageSize
        page_size_default: 50
        page_size_max: 100
        total_expr: it.data.totalItems

  - command: get project
    verb: get
    noun: project
    short: Get a project by identifier
    completion_noun: project
    flags_builtin:
      ui: true
    handler_type: endpoint
    endpoint:
      path: /ng/api/projects/{{ctx.id}}
      item_expr: it.data
      yaml_pick_expr: it.data.project
      query_params:
        accountIdentifier: auth.account
        orgIdentifier: auth.org

  - command: delete project
    verb: delete
    noun: project
    confirm_mode: confirm_id
    short: Delete a project by identifier
    handler_type: endpoint
    endpoint:
      method: DELETE
      path: /ng/api/projects/{{ctx.id}}
      text_header: "\nDeleted project {{ctx.id}}\n"
      query_params:
        accountIdentifier: auth.account
        orgIdentifier: auth.org

  - command: update project
    verb: update
    noun: project
    short: Update a project
    flags_builtin:
      set: true
      del: true
    handler_type: endpoint
    endpoint:
      method: PUT
      file_body: optional
      path: /ng/api/projects/{{ctx.id}}
      item_expr: it.data
      update_strategy: get-then-put
      update_body_pick: it.data.project
      update_body_wrap: project
      query_params:
        accountIdentifier: auth.account
        orgIdentifier: auth.org

  - command: create project
    verb: create
    noun: project
    requires_id: true
    short: Create a new project
    flags_builtin:
      set: true
    handler_type: endpoint
    endpoint:
      method: POST
      file_body: optional
      path: /ng/api/projects
      item_expr: it.data
      create_strategy: set-fields
      create_body_init:
        identifier: ctx.id
        name: coalesce(ctx.setArgs.name, ctx.id)
        color: '"#004fc4"'
        orgIdentifier: auth.org
      create_body_wrap: project
      query_params:
        accountIdentifier: auth.account
        orgIdentifier: auth.org

  - command: list user
    verb: list
    noun: user
    short: List users in the account
    flags_builtin:
    handler_type: endpoint
    flags:
      - name: search
        description: Filter users by name or email
    endpoint:
      method: POST
      path: /ng/api/user/aggregate
      items_expr: it.data.content
      columns: [uuid, email]
      get_id_expr: it.user.uuid
      completion:
        id_expr: it.user.uuid
        name_expr: it.user.email
      query_params:
        searchTerm: flags.search
      paging:
        paging_strategy: page_index
        countable: true
        page_index_param: pageIndex
        page_size_param: pageSize
        page_size_default: 50
        page_size_max: 100
        total_expr: it.data.totalItems

  - command: get user
    verb: get
    noun: user
    short: Get a user by identifier
    flags_builtin:
    handler_type: endpoint
    endpoint:
      path: /ng/api/user/aggregate/{{ctx.id}}
      item_expr: it.data
      yaml_pick_expr: it.data.user

  - command: list connector_catalogue
    verb: list
    noun: connector_catalogue
    short: List the connector types available, grouped by category
    handler_type: endpoint
    endpoint:
      path: /ng/api/connectors/catalogue
      items_expr: it.data.catalogue
      columns: [category, connectors]
      get_id_expr: it.category
      paging:
        paging_strategy: flat_list

  - command: list llm_model
    verb: list
    noun: llm_model
    short: "Discover the models of an LLM provider: harness list llm_model --provider ANTHROPIC [--url <url>] [--region <region>]"
    handler_type: endpoint
    flags:
      - name: provider
        description: "LLM provider: ANTHROPIC, OPENAI, GITHUB_COPILOT, HARNESS_OPENAI, HARNESS_ANTHROPIC"
        required: true
        completion_values: [ANTHROPIC, OPENAI, GITHUB_COPILOT, HARNESS_OPENAI, HARNESS_ANTHROPIC]
      - name: url
        description: Custom provider base URL
      - name: region
        description: Provider region (e.g. for Bedrock or Vertex)
    endpoint:
      method: POST
      path: /ng/api/llm-connector/models
      items_expr: it.data
      columns: [value, name]
      get_id_expr: it.value
      paging:
        paging_strategy: flat_list
      body_params:
        provider: flags.provider
        url: 'flags.url != "" ? flags.url : nil'
        region: 'flags.region != "" ? flags.region : nil'

  - command: execute user:invite
    verb: execute
    noun: user
    noun_variant: invite
    no_id: true
    short: "Invite users by email: harness execute user:invite --emails a@x.com,b@x.com [--role <role_id> --resource-group <rg_id>] [--user-groups <id>]"
    long: |
      Sends an invitation email to each address. --role and --resource-group together define the
      role binding the invitee receives; without them the invite carries no role binding.
    handler_type: endpoint
    flags:
      - name: emails
        description: Comma-separated email addresses to invite
        required: true
        is_array: true
      - name: role
        description: Role identifier to grant
      - name: resource-group
        description: Resource group identifier for the role binding
