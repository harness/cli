spec_version: 1
module_type: hidden
module_desc: Harness FME — Feature flags and targeting definitions
help_text: |
  ## Feature Management & Experimentation (fme)

  Manage feature flags and their environment-specific targeting definitions.

  {{nouns}}

nouns:
  - noun: feature_flag
    short_desc: A Harness FME feature flag.
    noun_aliases: [feature_flags, ff]
    fields:
      - id: name
        expr: it.name
      - id: description
        expr: it.description ?? ""
        mutable_path: description
        width_max: 60
      - id: traffic_type
        label: Traffic Type
        expr: it.trafficType.name
      - id: status
        expr: it.status
      - id: rollout_status
        label: Rollout Status
        expr: it.rolloutStatus.name ?? ""
        mutable_path: rolloutStatus.id
      - id: tags
        expr: join(map(it.tags, {#.name}), ", ")
        mutable_path: tags
        # v4 reads tags as {id, name} but writes them as {name}, so a member is just its
        # name, and the seed reshapes what was read into what can be written. The seed is
        # what makes --set/--del start from the tags the entity already has instead of
        # replacing them all, and it only runs when a mutation names this field.
        field_type: object_set
        mutable_seed_expr: 'it.tags == nil ? [] : map(it.tags, ({name: #.name}))'
        member_expr: "{name: member}"
        member_identity: el.name
        member_hint: <tag-name>
      - id: owners
        expr: join(map(it.owners, {#.name}), ", ")
        mutable_path: owners
        # Users are addressed by id, not email: v4 returns owners with an id and no email,
        # and a member has to be comparable against what was read for --del to match and
        # --set to stay idempotent. Use "harness list user" to look an id up.
        #
        # Groups go under "identifier" where users use "id" — sending the value under "id"
        # instead is rejected as "Invalid json structure", so "identifier" is the only key
        # the write DTO accepts. The value is the group's name, not an id, because the
        # resolver matches it against the FME team name in the workspace.
        #
        # Adding a group owner currently fails whatever is sent: v4 answers every value it
        # itself exposes for a group — the identifier, the display name, and both at once
        # for a group where they are the same string — with "group owner not found", so its
        # PATCH cannot accept the group owners its own GET returns. Reading and removing one
        # do work, which is what this member syntax is for. Quote a name containing spaces.
        field_type: object_set
        member_expr: >-
          lower(split(member, ":")[0]) == "user" ? {type: "USER", id: member[5:]} :
          lower(split(member, ":")[0]) == "group" ? {type: "GROUP", identifier: member[6:]} :
          nil
        member_identity: 'el.type == "USER" ? "user:" + el.id : "group:" + el.identifier'
        member_hint: user:<id> or group:<group-name>
        # Seeded from the read so --set/--del start from the current owners rather than
        # replacing them, reshaped here because v4 reads {id, type, name, email} and writes
        # {type, id} or {type, identifier}. Only evaluated when a mutation names owners, so
        # an update that does not touch them never sends them.
        mutable_seed_expr: >-
          it.owners == nil ? [] : map(it.owners, (#.type == "USER" ?
          {type: "USER", id: #.id} : {type: "GROUP", identifier: #.name}))
      - id: created
        expr: epochMs(it.createdAt * 1000)
        field_type: ts

  - noun: fme_environment
    short_desc: A Harness FME environment (distinct from the CD "environment" noun).
    noun_aliases: [fme_environments, fme_env]
    fields:
      - id: id
        expr: it.id
      - id: name
        expr: it.name
        mutable_path: name
      - id: production
        label: Production
        expr: string(it.isProduction)
        mutable_path: isProduction
      - id: status
        expr: it.status

  - noun: segment
    short_desc: A Harness FME segment (a named list of targeting keys).
    noun_aliases: [segments, seg]
    fields:
      - id: name
        expr: it.name
      - id: description
        expr: it.description ?? ""
        mutable_path: description
        width_max: 60
      - id: traffic_type
        label: Traffic Type
        expr: it.trafficType.name
      - id: segment_type
        label: Segment Type
        expr: it.segmentType
      - id: status
        expr: it.status
      - id: tags
        expr: join(map(it.tags, {#.name}), ", ")
        mutable_path: tags
        # v4 reads tags as {id, name} but writes them as {name}, so a member is just its
        # name, and the seed reshapes what was read into what can be written. The seed is
        # what makes --set/--del start from the tags the entity already has instead of
        # replacing them all, and it only runs when a mutation names this field.
        field_type: object_set
        mutable_seed_expr: 'it.tags == nil ? [] : map(it.tags, ({name: #.name}))'
        member_expr: "{name: member}"
        member_identity: el.name
        member_hint: <tag-name>
      - id: owners
        expr: join(map(it.owners, {#.name}), ", ")
        mutable_path: owners
        # Same addressing as feature_flag owners: users by id (the read carries no email to
        # compare against), groups by name under "identifier" — including the backend's
        # inability to add a group owner at all. Use "harness list user" to look an id up.
        field_type: object_set
        member_expr: >-
          lower(split(member, ":")[0]) == "user" ? {type: "USER", id: member[5:]} :
          lower(split(member, ":")[0]) == "group" ? {type: "GROUP", identifier: member[6:]} :
          nil
        member_identity: 'el.type == "USER" ? "user:" + el.id : "group:" + el.identifier'
        member_hint: user:<id> or group:<group-name>
        # Seeded from the read so --set/--del start from the current owners rather than
        # replacing them, reshaped here because v4 reads {id, type, name, email} and writes
        # {type, id} or {type, identifier}. Only evaluated when a mutation names owners, so
        # an update that does not touch them never sends them.
        mutable_seed_expr: >-
          it.owners == nil ? [] : map(it.owners, (#.type == "USER" ?
          {type: "USER", id: #.id} : {type: "GROUP", identifier: #.name}))
      - id: created
        expr: epochMs(it.createdAt * 1000)
        field_type: ts

  - noun: segment_key
    short_desc: One membership key of a segment definition (used for field lookup only).
    fields:
      - id: key
        expr: it.key

  - noun: traffic_type
    short_desc: Harness FME traffic type (read-only lookup).
    fields:
      - id: id
        expr: it.id
      - id: name
        expr: it.name

  - noun: rollout_status
    short_desc: Harness FME rollout status (read-only lookup).
    fields:
      - id: id
        expr: it.id
      - id: name
        expr: it.name
      - id: description
        expr: it.description ?? ""

  - noun: feature_flag_definition
    short_desc: A feature flag's environment-specific targeting definition (used for field lookup only).
    fields:
      - id: environment
        expr: it.environment.name
      - id: default_treatment
        label: Default Treatment
        expr: it.defaultTreatment
        mutable_path: defaultTreatment
      - id: baseline_treatment
        label: Baseline Treatment
        expr: it.baselineTreatment ?? ""
        mutable_path: baselineTreatment
      - id: traffic_allocation
        label: Traffic Allocation
        expr: string(it.trafficAllocation)
        mutable_path: trafficAllocation
      - id: is_killed
        label: Killed
        expr: string(it.isKilled)
      - id: created
        expr: epochMs(it.createdAt * 1000)
        field_type: ts

  - noun: segment_definition
    short_desc: A segment's environment-specific targeting definition (used for field lookup only).
    fields:
      - id: segment
        expr: it.segment.name
      - id: environment
        expr: it.environment.name
      - id: description
        expr: it.description ?? ""
        mutable_path: description
        width_max: 60
      - id: status
        expr: it.status
      - id: created
        expr: epochMs(it.createdAt * 1000)
        field_type: ts

commands:
  # ── feature_flag ─────────────────────────────────────────────────────────────

  - command: list feature_flag
    verb: list
    noun: feature_flag
    short: List feature flags
    handler_type: endpoint
    flags:
      - name: search
        description: Filter by name (partial match)
      - name: status
        description: "Filter by status: ACTIVE, ARCHIVED"
        completion_values: [ACTIVE, ARCHIVED]
    endpoint:
      path: /fme/api/v4/feature-flags
      items_expr: it.data
      item_item_expr: it
      get_id_expr: it.name
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        name: flags.search
        status: flags.status
      paging:
        paging_strategy: offset_limit
        page_index_param: offset
        page_size_param: limit
        page_size_default: 20
        page_size_max: 100
        total_expr: it.totalCount
        countable: true
      columns: [name, traffic_type, status, rollout_status, created]

  - command: get feature_flag
    verb: get
    noun: feature_flag
    short: Get feature flag details
    handler_type: endpoint
    endpoint:
      path: /fme/api/v4/feature-flags/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      item_expr: it
      yaml_pick_expr: it

  - command: create feature_flag
    verb: create
    noun: feature_flag
    short: "Create a feature flag: harness create ff <name> --traffic-type user"
    handler_type: endpoint
    flags:
      - name: traffic-type
        description: Traffic type for the feature flag (e.g. user, account)
        required: true
    flags_builtin:
      set: true
    endpoint:
      method: POST
      path: /fme/api/v4/feature-flags
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      create_strategy: set-fields
      create_body_init:
        name: ctx.id
        trafficType: flags["traffic-type"]
      create_body_wrap: ""
      item_expr: it.entity
      text_header: "\nCreated feature flag {{it.name}}\n"

  - command: update feature_flag
    verb: update
    noun: feature_flag
    short: "Update a feature flag: harness update ff <name> --set description=foo"
    handler_type: endpoint
    flags_builtin:
      set: true
      del: true
    endpoint:
      method: PATCH
      path: /fme/api/v4/feature-flags/{{ctx.id}}
      get_path: /fme/api/v4/feature-flags/{{ctx.id}}
      update_strategy: get-then-patch
      # v4's UpdateFeatureFlagRequest accepts only description/tags/owners/rolloutStatus
      # and rejects unknown properties, so the GET response cannot be echoed back —
      # id/name/trafficType/status/createdAt all make it a 400.
      #
      # tags/owners stay out too, even though --set/--del mutate them: each carries a
      # mutable_seed_expr, so the framework fetches their current members from the GET only
      # when a mutation names them. Carrying them here instead would send them on every
      # update, so an owner the API can no longer resolve would 400 a description change.
      #
      # rolloutStatus stays out — it is a scalar, so --set creates the path itself.
      update_body_pick: "{description: it.description}"
      update_body_wrap: ""
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      item_expr: it.entity
      text_header: "\nUpdated feature flag {{ctx.id}}\n"

  - command: delete feature_flag
    verb: delete
    noun: feature_flag
    confirm_mode: prompt
    short: Delete a feature flag (must have no active definitions)
    handler_type: endpoint
    endpoint:
      method: DELETE
      path: /fme/api/v4/feature-flags/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project

  - command: execute feature_flag:archive
    verb: execute
    noun: feature_flag
    noun_variant: archive
    short: Archive a feature flag (cascades to all definitions)
    handler_type: endpoint
    flags:
      - name: comment
        description: Audit comment
      - name: title
        description: Audit title
    endpoint:
      method: POST
      path: /fme/api/v4/feature-flags/{{ctx.id}}/archive
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      body_params:
        comment: flags.comment
        title: flags.title
      item_expr: it.entity
      text_header: "\nArchived feature flag {{ctx.id}}\n"

  - command: execute feature_flag:unarchive
    verb: execute
    noun: feature_flag
    noun_variant: unarchive
    short: Unarchive a feature flag
    handler_type: endpoint
    flags:
      - name: comment
        description: Audit comment
      - name: title
        description: Audit title
    endpoint:
      method: POST
      path: /fme/api/v4/feature-flags/{{ctx.id}}/unarchive
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      body_params:
        comment: flags.comment
        title: flags.title
      item_expr: it.entity
      text_header: "\nUnarchived feature flag {{ctx.id}}\n"

  # ── feature_flag:definition ───────────────────────────────────────────────────

  - command: list feature_flag:definition
    verb: list
    noun: feature_flag
    noun_variant: definition
    short: "List definitions for a flag across environments: harness list ff:definition <flag-name>"
    handler_type: endpoint
    requires_parentid: true
    parentid_label: "<flag-name>"
    fields_noun: feature_flag_definition
    endpoint:
      path: /fme/api/v4/feature-flag-definitions
      items_expr: it.data
      item_item_expr: it
      get_id_expr: it.featureFlag.name
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        feature_flag_name: ctx.parentId
      paging:
        paging_strategy: offset_limit
        page_index_param: offset
        page_size_param: limit
        page_size_default: 20
        page_size_max: 100
        total_expr: it.totalCount
        countable: true
      columns: [environment, default_treatment, traffic_allocation, is_killed, created]

  - command: get feature_flag:definition
    verb: get
    noun: feature_flag
    noun_variant: definition
    short: "Get a flag definition for a specific environment: harness get ff:definition <flag-name> --env <env-id>"
    handler_type: endpoint
    fields_noun: feature_flag_definition
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
    endpoint:
      path: /fme/api/v4/feature-flag-definitions/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
      item_expr: it
      yaml_pick_expr: it

  - command: create feature_flag:definition
    verb: create
    noun: feature_flag
    noun_variant: definition
    short: "Create a flag definition in an environment: harness create ff:definition <flag-name> --env <env-id> -f def.json"
    handler_type: endpoint
    fields_noun: feature_flag_definition
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
    endpoint:
      method: POST
      file_body: required
      path: /fme/api/v4/feature-flag-definitions/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
      item_expr: it.entity
      text_header: "\nCreated definition for {{ctx.id}} in {{flags.env}}\n"

  - command: update feature_flag:definition
    verb: update
    noun: feature_flag
    noun_variant: definition
    short: "Update a flag definition: harness update ff:definition <name> --env <env-id> --set traffic_allocation=80 (or -f body.json for treatments/rules/defaultRule)"
    handler_type: endpoint
    fields_noun: feature_flag_definition
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
      - name: comment
        description: Audit comment (metadata only — not stored on or returned by the definition)
      - name: title
        description: Audit title (metadata only — not stored on or returned by the definition)
    flags_builtin:
      set: true
      del: true
    endpoint:
      method: PATCH
      file_body: optional
      path: /fme/api/v4/feature-flag-definitions/{{ctx.id}}
      get_path: /fme/api/v4/feature-flag-definitions/{{ctx.id}}
      update_strategy: get-then-patch
      update_body_pick: '{trafficAllocation: it.trafficAllocation, defaultTreatment: it.defaultTreatment, baselineTreatment: it.baselineTreatment}'
      update_body_wrap: ""
      # comment/title are write-only: v4 accepts them as audit metadata but never stores or
      # returns them, so there is nothing in the GET for update_body_pick to select. As
      # body_params they are omitted entirely when the flag is unset — putting them in the
      # pick sent "comment": null, which a merge patch reads as "delete this field".
      body_params:
        comment: 'flags.comment != "" ? flags.comment : nil'
        title: 'flags.title != "" ? flags.title : nil'
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
      item_expr: it.entity
      text_header: "\nUpdated definition for {{ctx.id}} in {{flags.env}}\n"

  - command: delete feature_flag:definition
    verb: delete
    noun: feature_flag
    noun_variant: definition
    confirm_mode: prompt
    short: Delete a flag definition from an environment
    handler_type: endpoint
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
    endpoint:
      method: DELETE
      path: /fme/api/v4/feature-flag-definitions/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env

  - command: execute feature_flag:kill
    verb: execute
    noun: feature_flag
    noun_variant: kill
    short: "Kill a flag in an environment (all traffic → defaultTreatment): harness execute ff:kill <flag-name> --env <env-id>"
    handler_type: endpoint
    fields_noun: feature_flag_definition
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
      - name: comment
        description: Audit comment
    endpoint:
      method: POST
      path: /fme/api/v4/feature-flag-definitions/{{ctx.id}}/kill
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
      body_params:
        comment: flags.comment
      item_expr: it.entity
      text_header: "\nKilled feature flag {{ctx.id}} in {{flags.env}}\n"

  - command: execute feature_flag:restore
    verb: execute
    noun: feature_flag
    noun_variant: restore
    short: Restore a killed flag definition
    handler_type: endpoint
    fields_noun: feature_flag_definition
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
      - name: comment
        description: Audit comment
    endpoint:
      method: POST
      path: /fme/api/v4/feature-flag-definitions/{{ctx.id}}/restore
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
      body_params:
        comment: flags.comment
      item_expr: it.entity
      text_header: "\nRestored feature flag {{ctx.id}} in {{flags.env}}\n"

  - command: execute feature_flag:reallocate
    verb: execute
    noun: feature_flag
    noun_variant: reallocate
    short: Re-hash traffic distribution for a flag definition
    handler_type: endpoint
    fields_noun: feature_flag_definition
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
      - name: comment
        description: Audit comment
    endpoint:
      method: POST
      path: /fme/api/v4/feature-flag-definitions/{{ctx.id}}/reallocate
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
      body_params:
        comment: flags.comment
      item_expr: it.entity
      text_header: "\nReallocated traffic for {{ctx.id}} in {{flags.env}}\n"

  # ── fme_environment ────────────────────────────────────────────────────────────
  # Named fme_environment (not "environment") because the "environment" noun is
  # already owned by the cd module (a different resource).

  - command: list fme_environment
    verb: list
    noun: fme_environment
    short: List FME environments
    handler_type: endpoint
    endpoint:
      path: /fme/api/v4/environments
      items_expr: it.data
      item_item_expr: it
      get_id_expr: it.id
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      paging:
        paging_strategy: offset_limit
        page_index_param: offset
        page_size_param: limit
        page_size_default: 100
        page_size_max: 100
        total_expr: it.totalCount
        countable: true
      columns: [id, name, production, status]

  - command: get fme_environment
    verb: get
    noun: fme_environment
    short: "Get FME environment details: harness get fme_environment <environment-id>"
    handler_type: endpoint
    endpoint:
      path: /fme/api/v4/environments/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      item_expr: it
      yaml_pick_expr: it

  - command: create fme_environment
    verb: create
    noun: fme_environment
    short: "Create an FME environment: harness create fme_environment <name> [--production]"
    handler_type: endpoint
    flags:
      - name: production
        is_bool: true
        description: Mark the environment as a production environment
    flags_builtin:
      set: true
    endpoint:
      method: POST
      path: /fme/api/v4/environments
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      create_strategy: set-fields
      create_body_init:
        name: ctx.id
        isProduction: flags.production
      create_body_wrap: ""
      item_expr: it.entity
      text_header: "\nCreated environment {{it.name}}\n"

  - command: update fme_environment
    verb: update
    noun: fme_environment
    short: "Update an FME environment: harness update fme_environment <environment-id> --set name=foo"
    handler_type: endpoint
    flags_builtin:
      set: true
      del: true
    endpoint:
      method: PATCH
      path: /fme/api/v4/environments/{{ctx.id}}
      get_path: /fme/api/v4/environments/{{ctx.id}}
      update_strategy: get-then-patch
      update_body_pick: '{name: it.name, isProduction: it.isProduction}'
      update_body_wrap: ""
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      item_expr: it.entity
      text_header: "\nUpdated environment {{ctx.id}}\n"

  - command: delete fme_environment
    verb: delete
    noun: fme_environment
    confirm_mode: prompt
    short: Delete (archive) an FME environment
    handler_type: endpoint
    endpoint:
      method: DELETE
      path: /fme/api/v4/environments/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project

  # ── segment ──────────────────────────────────────────────────────────────────

  - command: list segment
    verb: list
    noun: segment
    short: "List segments of one type: harness list segment --segment-type STANDARD"
    handler_type: endpoint
    flags:
      # v4 keeps the three segment kinds in disjoint collections and rejects a list call
      # without segment_type, so there is no "all segments" query to default to.
      - name: segment-type
        description: "Segment type (required): STANDARD, LARGE, RULE_BASED"
        required: true
        completion_values: [STANDARD, LARGE, RULE_BASED]
      - name: status
        description: "Filter by status: ACTIVE, ARCHIVED (default ACTIVE)"
        completion_values: [ACTIVE, ARCHIVED]
    endpoint:
      path: /fme/api/v4/segments
      items_expr: it.data
      item_item_expr: it
      get_id_expr: it.name
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        segment_type: flags["segment-type"]
        status: flags.status
      paging:
        paging_strategy: offset_limit
        page_index_param: offset
        page_size_param: limit
        page_size_default: 100
        page_size_max: 100
        total_expr: it.totalCount
        countable: true
      columns: [name, traffic_type, status, created]

  - command: get segment
    verb: get
    noun: segment
    short: "Get segment details: harness get segment <name> --segment-type STANDARD"
    handler_type: endpoint
    flags:
      - name: segment-type
        description: "Segment type (required): STANDARD, LARGE, RULE_BASED"
        required: true
        completion_values: [STANDARD, LARGE, RULE_BASED]
    endpoint:
      path: /fme/api/v4/segments/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        segment_type: flags["segment-type"]
      item_expr: it
      yaml_pick_expr: it

  - command: create segment
    verb: create
    noun: segment
    short: "Create a segment: harness create segment <name> --traffic-type user --segment-type STANDARD"
    handler_type: endpoint
    flags:
      - name: traffic-type
        description: Traffic type for the segment (e.g. user, account)
        required: true
      - name: segment-type
        description: "Segment type (required): STANDARD, LARGE, RULE_BASED"
        required: true
        completion_values: [STANDARD, LARGE, RULE_BASED]
      - name: description
        description: Segment description
    flags_builtin:
      set: true
    endpoint:
      method: POST
      path: /fme/api/v4/segments
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      create_strategy: set-fields
      create_body_init:
        name: ctx.id
        trafficType: flags["traffic-type"]
        segmentType: flags["segment-type"]
        description: 'flags.description != "" ? flags.description : nil'
      create_body_wrap: ""
      item_expr: it.entity
      text_header: "\nCreated segment {{it.name}}\n"

  - command: update segment
    verb: update
    noun: segment
    short: "Update a segment: harness update segment <name> --segment-type STANDARD --set description=foo"
    handler_type: endpoint
    flags:
      - name: segment-type
        description: "Segment type (required): STANDARD, LARGE, RULE_BASED"
        required: true
        completion_values: [STANDARD, LARGE, RULE_BASED]
    flags_builtin:
      set: true
      del: true
    endpoint:
      method: PATCH
      path: /fme/api/v4/segments/{{ctx.id}}
      get_path: /fme/api/v4/segments/{{ctx.id}}
      update_strategy: get-then-patch
      # The v4 PATCH accepts only description/tags/owners, so the GET response cannot be
      # echoed back: id/name/trafficType/status/segmentType are all rejected.
      #
      # tags/owners stay out for the same reason as on feature_flag: their mutable_seed_expr
      # supplies the current members only when a --set/--del names them, so an update that
      # does not touch a collection never sends it.
      update_body_pick: "{description: it.description}"
      update_body_wrap: ""
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        segment_type: flags["segment-type"]
      item_expr: it.entity
      text_header: "\nUpdated segment {{ctx.id}}\n"

  - command: delete segment
    verb: delete
    noun: segment
    confirm_mode: prompt
    short: "Delete (archive) a segment: harness delete segment <name> --segment-type STANDARD"
    handler_type: endpoint
    flags:
      - name: segment-type
        description: "Segment type (required): STANDARD, LARGE, RULE_BASED"
        required: true
        completion_values: [STANDARD, LARGE, RULE_BASED]
    endpoint:
      method: DELETE
      path: /fme/api/v4/segments/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        segment_type: flags["segment-type"]

  # ── segment:definition ─────────────────────────────────────────────────────────

  - command: list segment:definition
    verb: list
    noun: segment
    noun_variant: definition
    short: "List segment definitions in an environment: harness list segment:definition --env <env-id>"
    handler_type: endpoint
    fields_noun: segment_definition
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
      - name: status
        description: "Filter by status: ACTIVE, ARCHIVED (default ACTIVE)"
        completion_values: [ACTIVE, ARCHIVED]
    endpoint:
      path: /fme/api/v4/segment-definitions
      items_expr: it.data
      item_item_expr: it
      get_id_expr: it.segment.name
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
        status: flags.status
      paging:
        paging_strategy: offset_limit
        page_index_param: offset
        page_size_param: limit
        page_size_default: 100
        page_size_max: 100
        total_expr: it.totalCount
        countable: true
      columns: [segment, environment, description, status, created]

  - command: get segment:definition
    verb: get
    noun: segment
    noun_variant: definition
    short: "Get a segment definition: harness get segment:definition <segment-name> --env <env-id>"
    handler_type: endpoint
    fields_noun: segment_definition
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
    endpoint:
      path: /fme/api/v4/segment-definitions/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
      item_expr: it
      yaml_pick_expr: it

  - command: create segment:definition
    verb: create
    noun: segment
    noun_variant: definition
    short: "Create a segment definition in an environment: harness create segment:definition <segment-name> --env <env-id> [--description desc]"
    handler_type: endpoint
    fields_noun: segment_definition
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
      - name: description
        description: Definition description
    endpoint:
      method: POST
      path: /fme/api/v4/segment-definitions/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
      body_params:
        description: 'flags.description != "" ? flags.description : nil'
      item_expr: it.entity
      text_header: "\nCreated segment definition for {{ctx.id}} in {{flags.env}}\n"

  - command: update segment:definition
    verb: update
    noun: segment
    noun_variant: definition
    short: "Update a segment definition: harness update segment:definition <segment-name> --env <env-id> --set description=foo"
    handler_type: endpoint
    fields_noun: segment_definition
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
    flags_builtin:
      set: true
      del: true
    endpoint:
      method: PATCH
      path: /fme/api/v4/segment-definitions/{{ctx.id}}
      get_path: /fme/api/v4/segment-definitions/{{ctx.id}}
      update_strategy: get-then-patch
      update_body_pick: "{description: it.description}"
      update_body_wrap: ""
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
      item_expr: it.entity
      text_header: "\nUpdated segment definition for {{ctx.id}} in {{flags.env}}\n"

  - command: delete segment:definition
    verb: delete
    noun: segment
    noun_variant: definition
    confirm_mode: prompt
    short: "Delete (archive) a segment definition from an environment: harness delete segment:definition <segment-name> --env <env-id>"
    handler_type: endpoint
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
    endpoint:
      method: DELETE
      path: /fme/api/v4/segment-definitions/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env

  # ── segment:definition:keys ───────────────────────────────────────────────────
  # Membership keys live on the definition, not the segment, so every keys command is
  # scoped to one environment with --env.

  - command: list segment:definition:keys
    verb: list
    noun: segment
    noun_variant: definition:keys
    short: "List the membership keys of a segment definition: harness list segment:definition:keys <segment-name> --env <env-id>"
    handler_type: endpoint
    requires_parentid: true
    parentid_label: "<segment-name>"
    fields_noun: segment_key
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
    endpoint:
      path: /fme/api/v4/segment-definitions/{{ctx.parentId}}/keys
      # The endpoint returns bare strings; wrap each one so it has a named field to render.
      items_expr: 'map(it.data, ({key: #}))'
      item_item_expr: it
      get_id_expr: it.key
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
      paging:
        paging_strategy: offset_limit
        page_index_param: offset
        page_size_param: limit
        page_size_default: 100
        page_size_max: 100
        total_expr: it.totalCount
        countable: true
      columns: [key]

  - command: execute segment:definition:add-keys
    verb: execute
    noun: segment
    noun_variant: definition:add-keys
    short: "Add membership keys to a segment definition: harness execute segment:definition:add-keys <segment-name> --env <env-id> --key user-1 --key user-2"
    handler_type: endpoint
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
      - name: key
        description: "Membership key to add (repeatable, up to 10000: --key user-1 --key user-2)"
        is_multi: true
        required: true
      - name: replace
        description: Replace the whole membership with the given keys instead of adding to it
        is_bool: true
      - name: comment
        description: Audit comment
      - name: title
        description: Audit title
    endpoint:
      method: POST
      path: /fme/api/v4/segment-definitions/{{ctx.id}}/keys
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
        # Only sent when asked for: the endpoint already defaults to replace=false.
        replace: 'flags.replace ? "true" : ""'
      body_params:
        keys: 'flags["key"]'
        comment: 'flags.comment != "" ? flags.comment : nil'
        title: 'flags.title != "" ? flags.title : nil'
      # The response echoes the submitted keys plus a governance result, not a segment, so
      # there is no entity to render fields from.
      no_fields: true
      text_header: "\nAdded {{len(flags[\"key\"])}} key(s) to {{ctx.id}} in {{flags.env}}\n"

  - command: execute segment:definition:remove-keys
    verb: execute
    noun: segment
    noun_variant: definition:remove-keys
    # POST, not DELETE: the keys to remove travel in a body, and DELETE with a body is
    # unreliable across HTTP clients, so v4 exposes this as .../keys/remove.
    short: "Remove membership keys from a segment definition: harness execute segment:definition:remove-keys <segment-name> --env <env-id> --key user-1"
    handler_type: endpoint
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
      - name: key
        description: "Membership key to remove (repeatable, at least one: --key user-1 --key user-2)"
        is_multi: true
        required: true
      - name: comment
        description: Audit comment
      - name: title
        description: Audit title
    endpoint:
      method: POST
      path: /fme/api/v4/segment-definitions/{{ctx.id}}/keys/remove
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
      body_params:
        keys: 'flags["key"]'
        comment: 'flags.comment != "" ? flags.comment : nil'
        title: 'flags.title != "" ? flags.title : nil'
      # Same echo-plus-governance response shape as add-keys: nothing to render as fields.
      no_fields: true
      text_header: "\nRemoved {{len(flags[\"key\"])}} key(s) from {{ctx.id}} in {{flags.env}}\n"

