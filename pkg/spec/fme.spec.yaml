    noun: metric
    confirm_mode: prompt
    short: "Delete a metric by id (hard delete, no archive/restore): harness delete metric <metric-id>"
    handler_type: endpoint
    endpoint:
      method: DELETE
      path: /fme/api/v4/metrics/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project

