        organization_identifier: auth.org
        project_identifier: auth.project
        segment_type: flags["segment-type"]
      item_expr: it
      yaml_pick_expr: it

  - command: create segment
    verb: create
    noun: segment
    short: "Create a segment: harness create segment <name> --traffic-type user --segment-type STANDARD (or -f segment.json)"
    handler_type: endpoint
    flags:
      - name: traffic-type
        description: Traffic type for the segment (e.g. user, account); required unless supplied via -f
      - name: segment-type
        description: "Segment type: STANDARD, LARGE, RULE_BASED; required unless supplied via -f"
        completion_values: [STANDARD, LARGE, RULE_BASED]
      - name: description
        description: Segment description
    flags_builtin:
      set: true
    endpoint:
      method: POST
      file_body: optional
      path: /fme/api/v4/segments
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      create_strategy: set-fields
      create_body_init:
        name: ctx.id
        trafficType: flags["traffic-type"]
        segmentType: flags["segment-type"]
        description: 'flags.description != "" ? flags.description : nil'
      create_body_wrap: ""
      item_expr: it.entity
      text_header: "\nCreated segment {{it.name}}\n"

  - command: update segment
    verb: update
    noun: segment
    short: "Update a segment: harness update segment <name> --segment-type STANDARD --set description=foo (or -f patch.json)"
    handler_type: endpoint
    flags:
      - name: segment-type
        description: "Segment type (required): STANDARD, LARGE, RULE_BASED"
        required: true
        completion_values: [STANDARD, LARGE, RULE_BASED]
    flags_builtin:
      set: true
      del: true
    endpoint:
      method: PATCH
      # --segment-type stays required: true here (unlike create) because it's a query-param
      # used to route to the right partition (segment_type below), not a body field a file
      # could supply instead — so it carries no -f collision risk.
      file_body: optional
      path: /fme/api/v4/segments/{{ctx.id}}
      get_path: /fme/api/v4/segments/{{ctx.id}}
      update_strategy: get-then-patch
      # The v4 PATCH accepts only description/tags/owners, so the GET response cannot be
      # echoed back: id/name/trafficType/status/segmentType are all rejected. Pick the
      # writable fields the GET carries; tags/owners are included (not just description)
      # so --add/--del can preserve other collection members under merge-PATCH's
      # whole-array-replace semantics.
      update_body_pick: "{description: it.description, tags: it.tags, owners: it.owners}"
      update_body_wrap: ""
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        segment_type: flags["segment-type"]
      item_expr: it.entity
      text_header: "\nUpdated segment {{ctx.id}}\n"

