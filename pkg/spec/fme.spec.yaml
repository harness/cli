  # ── metric ────────────────────────────────────────────────────────────────────
  # tags/owners are read-only here: the object_set field type needed for incremental
  # --set/--del mutation of them is still under discussion in cli#244. Once that lands,
  # update metric can pick them up without changing this command's other behavior.

  - command: list metric
    verb: list
    noun: metric
    short: List metrics
    handler_type: endpoint
    flags:
      - name: name
        description: Filter by name (partial match)
      - name: traffic-type-id
        description: Filter by traffic type id
      - name: event-type-id
        description: Filter by base event type id (repeatable in the API; the CLI sends one value)
        is_multi: true
      - name: tag
        description: Filter by tag name (repeatable in the API; the CLI sends one value)
        is_multi: true
      - name: id
        description: Filter to specific metric ids (repeatable in the API; the CLI sends one value)
        is_multi: true
      - name: sort-order
        description: "Sort direction by name: ASCENDING (default) or DESCENDING"
        completion_values: [ASCENDING, DESCENDING]
    endpoint:
      path: /fme/api/v4/metrics
      items_expr: it.data
      item_item_expr: it
      get_id_expr: it.id
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        name: flags.name
        traffic_type_id: flags["traffic-type-id"]
        event_type_ids: 'flags["event-type-id"][0]'
        tags: flags.tag[0]
        ids: flags.id[0]
        sort_order: flags["sort-order"]
      paging:
        paging_strategy: offset_limit
        page_index_param: offset
        page_size_param: limit
        page_size_default: 100
        page_size_max: 100
        total_expr: it.totalCount
        countable: true
      columns: [id, name, traffic_type, format, aggregation, status]

