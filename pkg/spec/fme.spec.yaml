    verb: get
    noun: metric
    short: "Get a metric by id: harness get metric <metric-id>"
    handler_type: endpoint
    endpoint:
      path: /fme/api/v4/metrics/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      item_expr: it
      yaml_pick_expr: it

  - command: create metric
    verb: create
    noun: metric
    short: "Create a metric: harness create metric <name> --traffic-type user --event-type signup --set format=NUMBER --set aggregation=COUNT --set isPositive=true (or -f metric.json)"
    handler_type: endpoint
    flags:
      - name: traffic-type
        description: Traffic type for the metric (e.g. user, account); required unless supplied via -f
      - name: event-type
        description: Base event type id (repeatable; at least one is required unless supplied via -f)
        is_multi: true
    flags_builtin:
      set: true
    endpoint:
      method: POST
      file_body: optional
      path: /fme/api/v4/metrics
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      create_strategy: set-fields
      create_body_init:
        name: ctx.id
        trafficType: flags["traffic-type"]
        baseEventTypes: 'map(flags["event-type"], ({eventTypeId: #}))'
      create_body_wrap: ""
      item_expr: it.entity
      text_header: "\nCreated metric {{it.name}}\n"

  - command: update metric
    verb: update
    noun: metric
    short: "Update a metric: harness update metric <metric-id> --set description=foo (or -f patch.json)"
    handler_type: endpoint
    flags_builtin:
      set: true
      del: true
    endpoint:
      method: PATCH
      file_body: optional
      path: /fme/api/v4/metrics/{{ctx.id}}
      get_path: /fme/api/v4/metrics/{{ctx.id}}
      update_strategy: get-then-patch
      # name/trafficType are immutable (rejected by the API) and stay out of this pick.
      # baseEventTypes is left out too: it's an array of {eventTypeId, propertyFilters} and
      # there's no flag/mutable_path for it yet, so a stale copy is safer than a silent no-op.
      # filterEventType, cap, and triggerEventType ARE update_body_pick-able per
      # UpdateMetricRequest.java, and are picked here (not omitted) so a scalar --set on one
      # field of any of them doesn't drop the rest of that object out of the merge-patch.
      # tags/owners are picked for the same reason, as with feature_flag/segment.
      update_body_pick: "{description: it.description, format: it.format, aggregation: it.aggregation, isPositive: it.isPositive, spread: it.spread, filterEventType: it.filterEventType, cap: it.cap, triggerEventType: it.triggerEventType, tags: it.tags, owners: it.owners}"
      update_body_wrap: ""
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      item_expr: it.entity
      text_header: "\nUpdated metric {{ctx.id}}\n"

