spec_version: 1
module_type: builtin
module_desc: Harness FME — Feature flags and targeting definitions
help_text: |
  ## Feature Management & Experimentation (fme)

  Manage feature flags and their environment-specific targeting definitions.

  {{nouns}}

nouns:
  - noun: feature_flag
    short_desc: A Harness FME feature flag.
    noun_aliases: [feature_flags, ff]
    fields:
      - id: name
        expr: it.name
      - id: description
        expr: it.description ?? ""
        mutable_path: description
        width_max: 60
      - id: traffic_type
        label: Traffic Type
        expr: it.trafficType.name
      - id: status
        expr: it.status
      - id: rollout_status
        label: Rollout Status
        expr: it.rolloutStatus.name ?? ""
        mutable_path: rolloutStatus.id
      - id: tags
        expr: join(map(it.tags, {#.name}), ", ")
        mutable_path: tags
        field_type: fme:tags
      - id: owners
        expr: join(map(it.owners, {#.name}), ", ")
        mutable_path: owners
        field_type: fme:owners
      - id: created
        expr: epochMs(it.createdAt * 1000)
        field_type: ts

  - noun: fme_environment
    short_desc: A Harness FME environment (distinct from the CD "environment" noun).
    noun_aliases: [fme_environments, fme_env]
    fields:
      - id: id
        expr: it.id
      - id: name
        expr: it.name
        mutable_path: name
      - id: production
        label: Production
        expr: string(it.isProduction)
        mutable_path: isProduction
      - id: status
        expr: it.status

  - noun: segment
    short_desc: A Harness FME segment (a named list of targeting keys).
    noun_aliases: [segments, seg]
    fields:
      - id: name
        expr: it.name
      - id: description
        expr: it.description ?? ""
        mutable_path: description
        width_max: 60
      - id: traffic_type
        label: Traffic Type
        expr: it.trafficType.name
      - id: segment_type
        label: Segment Type
        expr: it.segmentType
      - id: status
        expr: it.status
      - id: tags
        expr: join(map(it.tags, {#.name}), ", ")
        mutable_path: tags
        field_type: fme:tags
      - id: owners
        expr: join(map(it.owners, {#.name}), ", ")
        mutable_path: owners
        field_type: fme:owners
      - id: created
        expr: epochMs(it.createdAt * 1000)
        field_type: ts

  - noun: metric
    short_desc: A Harness FME metric definition (addressed by id, not name).
    noun_aliases: [metrics]
    fields:
      - id: id
        expr: it.id
      - id: name
        expr: it.name
      - id: description
        expr: it.description ?? ""
        mutable_path: description
        width_max: 60
      - id: traffic_type
        label: Traffic Type
        expr: it.trafficType.name
      - id: format
        expr: it.format
        mutable_path: format
      - id: aggregation
        expr: it.aggregation
        mutable_path: aggregation
      - id: is_positive
        label: Positive
        expr: string(it.isPositive)
        mutable_path: isPositive
      - id: spread
        expr: it.spread ?? ""
        mutable_path: spread
      - id: base_event_types
        label: Base Event Types
        expr: join(map(it.baseEventTypes, {#.eventTypeId}), ", ")
      - id: filter_event_type
        label: Filter Event Type
        expr: 'it.filterEventType == nil ? "" : it.filterEventType.eventTypeId'
        mutable_path: filterEventType.eventTypeId
      - id: filter_aggregation
        label: Filter Aggregation
        expr: 'it.filterEventType == nil ? "" : (it.filterEventType.filterAggregation ?? "")'
        mutable_path: filterEventType.filterAggregation
      - id: cap_metric_value
        label: Cap (Metric Value)
        expr: 'it.cap == nil ? "" : string(it.cap.metricValueCap ?? 0)'
        mutable_path: cap.metricValueCap
      - id: cap_base_event_count
        label: Cap (Base Event Count)
        expr: 'it.cap == nil ? "" : string(it.cap.baseEventCountCap ?? 0)'
        mutable_path: cap.baseEventCountCap
      - id: cap_base_event_sum
        label: Cap (Base Event Sum)
        expr: 'it.cap == nil ? "" : string(it.cap.baseEventSumCap ?? 0)'
        mutable_path: cap.baseEventSumCap
      - id: cap_base_event_value
        label: Cap (Base Event Value)
        expr: 'it.cap == nil ? "" : string(it.cap.baseEventValueCap ?? 0)'
        mutable_path: cap.baseEventValueCap
      - id: cap_filter_event_count
        label: Cap (Filter Event Count)
        expr: 'it.cap == nil ? "" : string(it.cap.filterEventCountCap ?? 0)'
        mutable_path: cap.filterEventCountCap
      - id: cap_filter_event_sum
        label: Cap (Filter Event Sum)
        expr: 'it.cap == nil ? "" : string(it.cap.filterEventSumCap ?? 0)'
        mutable_path: cap.filterEventSumCap
      - id: cap_filter_event_value
        label: Cap (Filter Event Value)
        expr: 'it.cap == nil ? "" : string(it.cap.filterEventValueCap ?? 0)'
        mutable_path: cap.filterEventValueCap
      - id: cap_granularity
        label: Cap Granularity
        expr: 'it.cap == nil ? "" : (it.cap.granularity ?? "")'
        mutable_path: cap.granularity
      - id: trigger_event_type
        label: Trigger Event Type
        expr: 'it.triggerEventType == nil ? "" : it.triggerEventType.eventTypeId'
        mutable_path: triggerEventType.eventTypeId
      - id: tags
        expr: join(map(it.tags, {#.name}), ", ")
        mutable_path: tags
        field_type: fme:tags
      - id: owners
        expr: join(map(it.owners, {#.name}), ", ")
        mutable_path: owners
        field_type: fme:owners
      - id: status
        expr: it.status
      - id: created
        expr: epochMs(it.createdAt * 1000)
        field_type: ts
      - id: modified
        expr: epochMs(it.modifiedAt * 1000)
        field_type: ts

  - noun: traffic_type
    short_desc: Harness FME traffic type (read-only lookup).
    fields:
      - id: id
        expr: it.id
      - id: name
        expr: it.name

  # An event type has no name or description by design: the events pipeline records neither,
  # so the id *is* the event name. Only event types with events in the last 30 days are visible.
  - noun: event_type
    short_desc: A Harness FME event type (read-only lookup for a metric's event types).
    noun_aliases: [event_types]
    fields:
      - id: id
        expr: it.id
      - id: traffic_types
        label: Traffic Types
        expr: join(map(it.trafficTypes, {#.name}), ", ")

  - noun: rollout_status
    short_desc: Harness FME rollout status (read-only lookup).
    fields:
      - id: id
        expr: it.id
      - id: name
        expr: it.name
      - id: description
        expr: it.description ?? ""

  - noun: feature_flag_definition
    short_desc: A feature flag's environment-specific targeting definition (used for field lookup only).
    fields:
      - id: environment
        expr: it.environment.name
      - id: default_treatment
        label: Default Treatment
        expr: it.defaultTreatment
        mutable_path: defaultTreatment
      - id: baseline_treatment
        label: Baseline Treatment
        expr: it.baselineTreatment ?? ""
        mutable_path: baselineTreatment
      - id: traffic_allocation
        label: Traffic Allocation
        expr: string(it.trafficAllocation)
        mutable_path: trafficAllocation
      - id: is_killed
        label: Killed
        expr: string(it.isKilled)
      - id: flag_sets
        label: Flag Sets
        expr: join(map(it.flagSets, {#.id}), ", ")
        mutable_path: flagSets
        field_type: fme:flag_sets
      - id: created
        expr: epochMs(it.createdAt * 1000)
        field_type: ts

  - noun: segment_definition
    short_desc: A segment's environment-specific targeting definition (used for field lookup only).
    fields:
      - id: segment
        expr: it.segment.name
      - id: environment
        expr: it.environment.name
      - id: description
        expr: it.description ?? ""
        mutable_path: description
        width_max: 60
      - id: status
        expr: it.status
      - id: created
        expr: epochMs(it.createdAt * 1000)
        field_type: ts

  - noun: experiment
    short_desc: A Harness FME experiment run against a feature flag or AI Config.
    noun_aliases: [experiments, exp]
    fields:
      - id: id
        expr: it.id
      - id: name
        expr: it.name
      - id: parent_type
        label: Parent Type
        expr: it.parent.type
      - id: parent
        expr: it.parent.name ?? it.parent.id
      - id: description
        expr: it.description ?? ""
        mutable_path: description
        width_max: 60
      - id: hypothesis
        expr: it.hypothesis ?? ""
        mutable_path: hypothesis
        width_max: 60
      - id: environment
        expr: it.environment.name
      - id: traffic_type
        label: Traffic Type
        expr: it.trafficType.name
      - id: start_at
        label: Start At
        expr: it.startAt
        mutable_path: startAt
      - id: end_at
        label: End At
        expr: it.endAt
        mutable_path: endAt
      - id: baseline_treatment
        label: Baseline Treatment
        expr: it.baselineTreatment
        mutable_path: baselineTreatment
      - id: comparison_treatments
        label: Comparison Treatments
        expr: join(it.comparisonTreatments, ", ")
        mutable_path: comparisonTreatments
        field_type: set
      - id: key_metrics
        label: Key Metrics
        expr: join(map(it.keyMetrics, {#.name}), ", ")
        mutable_path: keyMetrics
        field_type: fme:metric_refs
      - id: supporting_metrics
        label: Supporting Metrics
        expr: join(map(it.supportingMetrics, {#.name}), ", ")
        mutable_path: supportingMetrics
        field_type: fme:metric_refs
      - id: tags
        expr: join(map(it.tags, {#.name}), ", ")
        mutable_path: tags
        field_type: fme:tags
      - id: owners
        expr: join(map(it.owners, {#.name}), ", ")
        mutable_path: owners
        field_type: fme:owners
      - id: status
        expr: it.status
        mutable_path: status
      - id: created
        expr: it.createdAt
      - id: modified
        expr: it.modifiedAt

  - noun: experiment_settings
    short_desc: An experiment's statistical settings (used for field lookup only).
    fields:
      - id: id
        expr: it.id
      - id: source
        expr: it.source
      - id: statistical_test_type
        label: Statistical Test Type
        expr: it.statisticalTestType
        mutable_path: statisticalTestType
      - id: significance_threshold
        label: Significance Threshold
        expr: string(it.significanceThreshold)
        mutable_path: significanceThreshold
      - id: multiple_comparison_correction
        label: Multiple Comparison Correction
        expr: it.multipleComparisonCorrection
        mutable_path: multipleComparisonCorrection
      - id: minimum_sample_size
        label: Minimum Sample Size
        expr: string(it.minimumSampleSize)
        mutable_path: minimumSampleSize
      - id: review_period
        label: Review Period
        expr: it.reviewPeriod
        mutable_path: reviewPeriod
      - id: variance_reduction
        label: Variance Reduction
        expr: it.varianceReduction.method
        mutable_path: varianceReduction.method

  - noun: experiment_alerts
    short_desc: An experiment's alerting configuration (used for field lookup only).
    fields:
      - id: id
        expr: it.id
      - id: is_enabled
        label: Enabled
        expr: string(it.isEnabled)
        mutable_path: isEnabled

  - noun: experiment_results
    short_desc: A metric result for an experiment comparison (used for field lookup only, read-only).
    fields:
      - id: metric_id
        label: Metric Id
        expr: it.metricId.id
      - id: metric_name
        label: Metric Name
        expr: it.metricId.name
      - id: category
        expr: it.category
      - id: comparison
        expr: it.comparison
      - id: positive
        expr: string(it.positive)
      - id: value
        expr: 'it.value == nil ? "" : string(it.value)'
      - id: error_margin
        label: Error Margin
        expr: 'it.errorMargin == nil ? "" : string(it.errorMargin)'
      - id: pvalue
        label: P-Value
        expr: 'it.pvalue == nil ? "" : string(it.pvalue)'
      - id: metric_result_state
        label: State
        expr: it.metricResultState
      - id: impact_lower
        label: Impact Lower
        expr: 'it.impactLower == nil ? "" : string(it.impactLower)'
      - id: impact_upper
        label: Impact Upper
        expr: 'it.impactUpper == nil ? "" : string(it.impactUpper)'
      - id: baseline_mean
        label: Baseline Mean
        expr: 'it.baselineMean == nil ? "" : string(it.baselineMean)'
      - id: comparison_mean
        label: Comparison Mean
        expr: 'it.comparisonMean == nil ? "" : string(it.comparisonMean)'
      - id: baseline_sample_size
        label: Baseline Sample Size
        expr: 'it.baselineSampleSize == nil ? "" : string(it.baselineSampleSize)'
      - id: comparison_sample_size
        label: Comparison Sample Size
        expr: 'it.comparisonSampleSize == nil ? "" : string(it.comparisonSampleSize)'
      - id: variance_reduction_method
        label: Variance Reduction Method
        expr: it.varianceReduction.method

commands:
  # ── feature_flag ─────────────────────────────────────────────────────────────

  - command: list feature_flag
    verb: list
    noun: feature_flag
    short: List feature flags
    handler_type: endpoint
    flags:
      - name: search
        description: Filter by name (partial match)
      - name: status
        description: "Filter by status: ACTIVE, ARCHIVED"
        completion_values: [ACTIVE, ARCHIVED]
    endpoint:
      path: /fme/api/v4/feature-flags
      items_expr: it.data
      item_item_expr: it
      get_id_expr: it.name
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        name: flags.search
        status: flags.status
      paging:
        paging_strategy: offset_limit
        page_index_param: offset
        page_size_param: limit
        page_size_default: 20
        page_size_max: 100
        total_expr: it.totalCount
        countable: true
      columns: [name, traffic_type, status, rollout_status, created]

  - command: get feature_flag
    verb: get
    noun: feature_flag
    short: Get feature flag details
    handler_type: endpoint
    endpoint:
      path: /fme/api/v4/feature-flags/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      item_expr: it
      yaml_pick_expr: it

  - command: create feature_flag
    verb: create
    noun: feature_flag
    short: "Create a feature flag: harness create ff <name> --traffic-type user (or -f ff.json)"
    handler_type: endpoint
    flags:
      - name: traffic-type
        description: Traffic type for the feature flag (e.g. user, account); required unless supplied via -f
    flags_builtin:
      set: true
    endpoint:
      method: POST
      file_body: optional
      path: /fme/api/v4/feature-flags
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      create_strategy: set-fields
      create_body_init:
        name: ctx.id
        trafficType: flags["traffic-type"]
      create_body_wrap: ""
      item_expr: it.entity
      text_header: "\nCreated feature flag {{it.name}}\n"

  - command: update feature_flag
    verb: update
    noun: feature_flag
    short: "Update a feature flag: harness update ff <name> --set description=foo (or -f patch.json)"
    handler_type: endpoint
    flags_builtin:
      set: true
      del: true
    endpoint:
      method: PATCH
      file_body: optional
      path: /fme/api/v4/feature-flags/{{ctx.id}}
      get_path: /fme/api/v4/feature-flags/{{ctx.id}}
      update_strategy: get-then-patch
      # v4's UpdateFeatureFlagRequest accepts only description/tags/owners/rolloutStatus
      # and rejects unknown properties, so the GET response cannot be echoed back —
      # id/name/trafficType/status/createdAt all make it a 400. Pick the writable
      # fields the GET carries; rolloutStatus is created by --set via its mutable_path,
      # and the PATCH is an RFC 7396 merge patch, so anything omitted is left untouched.
      # tags/owners are picked (not just description) so --add/--del owners.* and
      # --add/--del tags.* can preserve the other members of the collection.
      update_body_pick: "{description: it.description, tags: it.tags, owners: it.owners}"
      update_body_wrap: ""
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      item_expr: it.entity
      text_header: "\nUpdated feature flag {{ctx.id}}\n"

  - command: delete feature_flag
    verb: delete
    noun: feature_flag
    confirm_mode: prompt
    short: "Delete a feature flag (must have no active definitions): harness delete feature_flag <name> [--comment <text>] [--title <text>]"
    handler_type: endpoint
    flags:
      - name: comment
        description: Audit comment
      - name: title
        description: Audit title
    endpoint:
      method: DELETE
      path: /fme/api/v4/feature-flags/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      # comment/title travel as a JSON body (not query params): the v4 resource takes
      # @Valid ArchiveUnarchiveRequest with no @QueryParam, unlike segment:definition's delete.
      # Omitted (not sent as null/empty) when unset, same reasoning as feature_flag:definition update.
      body_params:
        comment: 'flags.comment != "" ? flags.comment : nil'
        title: 'flags.title != "" ? flags.title : nil'

  - command: execute feature_flag:archive
    verb: execute
    noun: feature_flag
    noun_variant: archive
    short: Archive a feature flag (cascades to all definitions)
    handler_type: endpoint
    flags:
      - name: comment
        description: Audit comment
      - name: title
        description: Audit title
    endpoint:
      method: POST
      path: /fme/api/v4/feature-flags/{{ctx.id}}/archive
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      body_params:
        comment: flags.comment
        title: flags.title
      item_expr: it.entity
      text_header: "\nArchived feature flag {{ctx.id}}\n"

  - command: execute feature_flag:unarchive
    verb: execute
    noun: feature_flag
    noun_variant: unarchive
    short: Unarchive a feature flag
    handler_type: endpoint
    flags:
      - name: comment
        description: Audit comment
      - name: title
        description: Audit title
    endpoint:
      method: POST
      path: /fme/api/v4/feature-flags/{{ctx.id}}/unarchive
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
      body_params:
        comment: flags.comment
        title: flags.title
      item_expr: it.entity
      text_header: "\nUnarchived feature flag {{ctx.id}}\n"

  # ── feature_flag:definition ───────────────────────────────────────────────────

  - command: list feature_flag:definition
    verb: list
    noun: feature_flag
    noun_variant: definition
    short: "List definitions for a flag across environments: harness list ff:definition <flag-name>"
    handler_type: endpoint
    requires_parentid: true
    parentid_label: "<flag-name>"
    fields_noun: feature_flag_definition
    endpoint:
      path: /fme/api/v4/feature-flag-definitions
      items_expr: it.data
      item_item_expr: it
      get_id_expr: it.featureFlag.name
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        feature_flag_name: ctx.parentId
      paging:
        paging_strategy: offset_limit
        page_index_param: offset
        page_size_param: limit
        page_size_default: 20
        page_size_max: 100
        total_expr: it.totalCount
        countable: true
      columns: [environment, default_treatment, traffic_allocation, is_killed, created]

  - command: get feature_flag:definition
    verb: get
    noun: feature_flag
    noun_variant: definition
    short: "Get a flag definition for a specific environment: harness get ff:definition <flag-name> --env <env-id>"
    handler_type: endpoint
    fields_noun: feature_flag_definition
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
    endpoint:
      path: /fme/api/v4/feature-flag-definitions/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
      item_expr: it
      yaml_pick_expr: it

  - command: create feature_flag:definition
    verb: create
    noun: feature_flag
    noun_variant: definition
    short: "Create a flag definition in an environment: harness create ff:definition <flag-name> --env <env-id> -f def.json"
    handler_type: endpoint
    fields_noun: feature_flag_definition
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
    endpoint:
      method: POST
      file_body: required
      path: /fme/api/v4/feature-flag-definitions/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
      item_expr: it.entity
      text_header: "\nCreated definition for {{ctx.id}} in {{flags.env}}\n"

  - command: update feature_flag:definition
    verb: update
    noun: feature_flag
    noun_variant: definition
    short: "Update a flag definition: harness update ff:definition <name> --env <env-id> --set traffic_allocation=80 (or -f body.json for treatments/rules/defaultRule)"
    handler_type: endpoint
    fields_noun: feature_flag_definition
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
      - name: comment
        description: Audit comment (metadata only — not stored on or returned by the definition)
      - name: title
        description: Audit title (metadata only — not stored on or returned by the definition)
    flags_builtin:
      set: true
      del: true
    endpoint:
      method: PATCH
      file_body: optional
      path: /fme/api/v4/feature-flag-definitions/{{ctx.id}}
      get_path: /fme/api/v4/feature-flag-definitions/{{ctx.id}}
      update_strategy: get-then-patch
      # flagSets is picked (not just the three scalars) so --add/--del flag_sets.* can
      # preserve the other members of the collection, same reasoning as tags/owners.
      update_body_pick: '{trafficAllocation: it.trafficAllocation, defaultTreatment: it.defaultTreatment, baselineTreatment: it.baselineTreatment, flagSets: it.flagSets}'
      update_body_wrap: ""
      # comment/title are write-only: v4 accepts them as audit metadata but never stores or
      # returns them, so there is nothing in the GET for update_body_pick to select. As
      # body_params they are omitted entirely when the flag is unset — putting them in the
      # pick sent "comment": null, which a merge patch reads as "delete this field".
      body_params:
        comment: 'flags.comment != "" ? flags.comment : nil'
        title: 'flags.title != "" ? flags.title : nil'
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
      item_expr: it.entity
      text_header: "\nUpdated definition for {{ctx.id}} in {{flags.env}}\n"

  - command: delete feature_flag:definition
    verb: delete
    noun: feature_flag
    noun_variant: definition
    confirm_mode: prompt
    short: Delete a flag definition from an environment
    handler_type: endpoint
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
    endpoint:
      method: DELETE
      path: /fme/api/v4/feature-flag-definitions/{{ctx.id}}
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env

  - command: execute feature_flag:kill
    verb: execute
    noun: feature_flag
    noun_variant: kill
    short: "Kill a flag in an environment (all traffic → defaultTreatment): harness execute ff:kill <flag-name> --env <env-id>"
    handler_type: endpoint
    fields_noun: feature_flag_definition
    flags:
      - name: env
        description: Environment identifier (required)
        required: true
      - name: comment
        description: Audit comment
      - name: title
        description: Audit title
    endpoint:
      method: POST
      path: /fme/api/v4/feature-flag-definitions/{{ctx.id}}/kill
      query_params:
        account_id: auth.account
        organization_identifier: auth.org
        project_identifier: auth.project
        environment_id: flags.env
      body_params:
        comment: flags.comment
        title: flags.title
      item_expr: it.entity
      text_header: "\nKilled feature flag {{ctx.id}} in {{flags.env}}\n"

  - command: execute feature_flag:restore
    verb: execute
    noun: feature_flag
    noun_variant: restore
    short: Restore a killed flag definition
    handler_type: endpoint
    fields_noun: feature_flag_definition
    flags:
      - name: env
