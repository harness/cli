spec_version: 1
module_type: hidden
module_desc: Harness AI Evals — datasets, evaluations, runs, metrics, metric sets, suites, and targets
help_text: |
  ## AI Evals (aievals)

  The AI Evals module lets you define, run, and score evaluations of LLM
  pipelines and prompts. It is built around a dataset → evaluation → run
  lifecycle with configurable metrics and targets.

  ### Domain Model

  An eval_dataset holds input/output pairs (rows) used as test cases.

  An evaluation wires together a dataset, an eval_target (the LLM endpoint
  under test), and an eval_metric_set (the scoring criteria). Trigger a run
  with `execute evaluation:run <eval_id>`.

  An eval_run is one execution of an evaluation. It scores every dataset item
  against the metric set and produces an aggregate pass rate.

  An eval_metric is a single scoring function (e.g. exact_match, rubric_judge,
  contains, geval). Metrics are grouped into eval_metric_sets with optional
  pass/fail thresholds.

  An eval_target points at the LLM endpoint being tested (e.g. a Harness AI
  Gateway route).

  An eval_suite groups multiple evaluations that should run together. Trigger
  the whole suite with `execute eval_suite:run <suite_id>`.

  ### Typical workflow

    harness create eval_dataset --set name=smoke identifier=smoke
    harness create eval_target  --set name=my-llm type=prompt
    harness create eval_metric_set --set name=basic
    harness create evaluation   --set name=v1 dataset_id=<id> target_id=<id>
    harness execute evaluation:run <eval_id>
    harness list eval_run <eval_id>

  ### Nouns

  {{nouns}}

nouns:
  - noun: eval_dataset
    short_desc: An AI Evals dataset containing input/output pairs for evaluation.
    noun_aliases: [eval_datasets]
    fields:
      - id: id
        label: ID
        expr: it.uuid
      - id: identifier
        expr: it.identifier
        mutable_path: identifier
      - id: name
        expr: it.name
        mutable_path: name
      - id: description
        expr: it.description
        mutable_path: description
      - id: item_count
        label: Items
        expr: it.item_count
        align: right
      - id: created
        expr: it.created
      - id: updated
        expr: it.updated

  - noun: evaluation
    short_desc: An AI Eval wiring a dataset, target, and metric set. Trigger runs via execute action run.
    noun_aliases: [evaluations, eval]
    fields:
      - id: id
        label: ID
        expr: it.id
      - id: name
        expr: it.name
        mutable_path: name
      - id: description
        expr: it.description
        mutable_path: description
      - id: dataset_id
        label: Dataset
        expr: it.dataset_id
        mutable_path: dataset_id
      - id: dataset_name
        label: Dataset
        expr: it.dataset_name
      - id: target_id
        label: Target
        expr: it.target_id
        mutable_path: target_id
      - id: target_name
        label: Target
        expr: it.target_name
      - id: metric_set_id
        label: Metric Set
        expr: it.metric_set_id
        mutable_path: metric_set_id
      - id: status
        expr: it.status
      - id: tags
        expr: it.tags
        mutable_path: tags
        field_type: set
      - id: sampling_strategy
        expr: it.sampling_strategy
        mutable_path: sampling_strategy
      - id: sample_size
        expr: it.sample_size
        mutable_path: sample_size
      - id: concurrency
        expr: it.concurrency
        mutable_path: concurrency
      - id: cost_limit_usd
        expr: it.cost_limit_usd
        mutable_path: cost_limit_usd
      - id: timeout_per_item_ms
        expr: it.timeout_per_item_ms
        mutable_path: timeout_per_item_ms
      - id: storage_type
        expr: it.storage_type
        mutable_path: storage_type
      - id: git_connector_ref
        expr: it.git_source.connector_ref
        mutable_path: git_source.connector_ref
      - id: git_repo
        expr: it.git_source.repo
        mutable_path: git_source.repo
      - id: git_branch
        expr: it.git_source.branch
        mutable_path: git_source.branch
      - id: git_file_path
        expr: it.git_source.file_path
        mutable_path: git_source.file_path
      # The fields below are not part of the eval resource itself — they're
      # only meaningful as inputs to `execute evaluation:run` (TriggerEvalRunRequest),
      # but the create/update/execute commands on this noun share one mutable-field
      # pool, so they're declared here too. expr evaluates to empty on get/list.
      - id: trigger_type
        expr: it.trigger_type
        mutable_path: trigger_type
      - id: notes
        expr: it.notes
        mutable_path: notes
      - id: input_set_id
        expr: it.input_set_id
        mutable_path: input_set_id
      - id: branch
        expr: it.branch
        mutable_path: branch
      - id: run_target_id
        expr: it.run_inputs.target_id
        mutable_path: run_inputs.target_id
      - id: run_dataset_id
        expr: it.run_inputs.dataset_id
        mutable_path: run_inputs.dataset_id
      - id: run_metric_set_id
        expr: it.run_inputs.metric_set_id
        mutable_path: run_inputs.metric_set_id
      - id: total_runs
        label: Runs
        expr: it.total_runs
        align: right
      - id: created
        expr: it.created_at

  - noun: eval_run
    short_desc: A single execution of an AI Eval with per-item scores and an aggregate pass rate.
    noun_aliases: [eval_runs]
    fields:
      - id: id
        label: ID
        expr: it.run_id
      - id: eval_id
        label: Eval
        expr: it.eval_id
      - id: status
        expr: it.status
      - id: total_items
        label: Items
        expr: it.total_items
        align: right
      - id: success_count
        label: Passed
        expr: it.success_count
        align: right
      - id: failed_count
        label: Failed
        expr: it.failed_count
        align: right
      - id: started
        expr: it.started_at
      - id: finished
        expr: it.completed_at
      - id: item_id
        label: ID
        expr: it.id
      - id: dataset_item_id
        label: Dataset Item
        expr: it.dataset_item_id
      - id: duration_ms
        label: Duration (ms)
        expr: it.duration_ms
        align: right

  - noun: eval_metric
    short_desc: An AI Evals metric (e.g. exact_match, rubric_judge, contains, geval).
    noun_aliases: [eval_metrics]
    fields:
      - id: id
        label: ID
        expr: it.id
      - id: name
        expr: it.name
        mutable_path: name
      - id: type
        expr: it.type
        mutable_path: type
      - id: kind
        expr: it.kind
        mutable_path: kind
      - id: dimension
        expr: it.dimension
        mutable_path: dimension
      - id: description
        expr: it.description
        mutable_path: description

  - noun: eval_metric_set
    short_desc: A named collection of AI Evals metrics with optional thresholds.
    noun_aliases: [eval_metric_sets]
    fields:
      - id: id
        label: ID
        expr: it.id
      - id: name
        expr: it.name
        mutable_path: name
      - id: description
        expr: it.description
        mutable_path: description
      - id: metric_count
        label: Metrics
        expr: len(it.entries)
        align: right
      - id: judge_model_id
        label: Judge
        expr: it.judge_model_id
        mutable_path: judge_model_id
      - id: judge_llm_connector_ref
        expr: it.judge_llm_connector_ref
        mutable_path: judge_llm_connector_ref

  - noun: eval_target
    short_desc: An AI Evals target — the LLM endpoint under test.
    noun_aliases: [eval_targets]
    fields:
      - id: id
        label: ID
        expr: it.id
      - id: name
        expr: it.name
        mutable_path: name
      - id: type
        expr: it.type
        mutable_path: type
      - id: connector_ref
        label: Connector
        expr: it.connector_ref
        mutable_path: connector_ref
      - id: description
        expr: it.description
        mutable_path: description

  - noun: eval_suite
    short_desc: A named collection of evaluations run together.
    noun_aliases: [eval_suites]
    fields:
      - id: id
        label: ID
        expr: it.suite_id
      - id: name
        expr: it.name
      - id: description
        expr: it.description
      - id: last_run_status
        label: Last Run
        expr: it.last_run_status

commands:
  # ── eval_dataset ──────────────────────────────────────────────────────────────

  - command: list eval_dataset
    verb: list
    noun: eval_dataset
    short: "List AI Evals datasets: harness list eval_dataset [--search <text>] [--target-id <uuid>]"
    handler_type: endpoint
    flags:
      - name: search
        description: Filter by name, identifier, or description
      - name: target-id
        description: Filter to datasets used by evals referencing this target UUID
    endpoint:
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/dataset
      request_headers:
        Harness-Account: auth.account
      items_expr: it.data
      get_id_expr: it.uuid
      query_params:
        page: flags.page
        limit: flags.limit
        search: flags.search
        target_id: 'flags["target-id"]'
      paging:
        paging_strategy: page_index
        countable: true
        page_index_param: page
        page_size_param: limit
        page_size_default: 20
        page_size_max: 200
        total_expr: it.total_elements
      columns: [identifier, name, item_count, created]

  - command: get eval_dataset
    verb: get
    noun: eval_dataset
    short: "Get an AI Evals dataset by ID"
    handler_type: endpoint
    endpoint:
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/dataset/{{ctx.id}}
      request_headers:
        Harness-Account: auth.account
      item_expr: it

  - command: create eval_dataset
    verb: create
    noun: eval_dataset
    short: "Create an AI Evals dataset: harness create eval_dataset --set name=... identifier=..."
    handler_type: endpoint
    flags_builtin:
      set: true
    endpoint:
      method: POST
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/dataset
      request_headers:
        Harness-Account: auth.account
      create_strategy: set-fields
      create_body_wrap: ""
      text_header: "\nCreated dataset {{it.identifier}}\n"

  - command: delete eval_dataset
    verb: delete
    noun: eval_dataset
    confirm_mode: prompt
    short: Delete an AI Evals dataset by ID
    handler_type: endpoint
    endpoint:
      method: DELETE
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/dataset/{{ctx.id}}
      request_headers:
        Harness-Account: auth.account
      item_expr: it

  # ── evaluation ────────────────────────────────────────────────────────────────

  - command: list evaluation
    verb: list
    noun: evaluation
    short: "List AI Evals evaluations: harness list evaluation [--search <text>] [--status active|draft|archived] [--metric-set-id <uuid>] [--target-id <uuid>]"
    handler_type: endpoint
    flags:
      - name: search
        description: Filter by name or description
      - name: status
        description: Filter by status
        completion_values: [active, draft, archived]
      - name: metric-set-id
        description: Filter by metric set UUID
      - name: target-id
        description: Filter by one or more target UUIDs (repeatable)
        is_multi: true
    endpoint:
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/evals
      request_headers:
        Harness-Account: auth.account
      items_expr: it.data
      get_id_expr: it.id
      query_params:
        page: flags.page
        limit: flags.limit
        search: flags.search
        status: flags.status
        metric_set_id: 'flags["metric-set-id"]'
        # target-id is repeatable (is_multi); join() turns the []string into the
        # comma-separated value the API expects. Works whether the user passes
        # one --target-id per value or a comma-joined list in a single flag.
        target_id: 'join(flags["target-id"], ",")'
      paging:
        paging_strategy: page_index
        countable: true
        page_index_param: page
        page_size_param: limit
        page_size_default: 20
        page_size_max: 200
        total_expr: it.total_elements
      columns: [id, name, dataset_name, target_name, status, total_runs]

  - command: get evaluation
    verb: get
    noun: evaluation
    short: Get an AI Eval by ID
    handler_type: endpoint
    endpoint:
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/evals/{{ctx.id}}
      request_headers:
        Harness-Account: auth.account
      item_expr: it

  - command: create evaluation
    verb: create
    noun: evaluation
    short: "Create an AI Eval: harness create evaluation --set name=... dataset_id=... target_id=..."
    handler_type: endpoint
    flags_builtin:
      set: true
    endpoint:
      method: POST
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/evals
      request_headers:
        Harness-Account: auth.account
      create_strategy: set-fields
      create_body_wrap: ""
      text_header: "\nCreated eval {{it.id}}\n"

  - command: update evaluation
    verb: update
    noun: evaluation
    short: "Update an AI Eval: harness update evaluation <id> --set dataset_id=... target_id=... metric_set_id=..."
    handler_type: endpoint
    flags_builtin:
      set: true
      del: true
    endpoint:
      method: PATCH
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/evals/{{ctx.id}}
      get_path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/evals/{{ctx.id}}
      request_headers:
        Harness-Account: auth.account
      update_strategy: get-then-patch
      update_body_pick: it
      update_body_wrap: ""
      item_expr: it
      text_header: "\nUpdated eval {{ctx.id}}\n"

  - command: delete evaluation
    verb: delete
    noun: evaluation
    confirm_mode: prompt
    short: Delete an AI Eval by ID
    handler_type: endpoint
    endpoint:
      method: DELETE
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/evals/{{ctx.id}}
      request_headers:
        Harness-Account: auth.account
      item_expr: it

  - command: execute evaluation:run
    verb: execute
    noun: evaluation
    noun_variant: run
    short: "Trigger a new run for an evaluation: harness execute evaluation:run <eval_id> [--set sampling_strategy=... branch=... notes=...]"
    handler_type: endpoint
    flags_builtin:
      set: true
    endpoint:
      method: POST
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/evals/{{ctx.id}}/run
      request_headers:
        Harness-Account: auth.account
      create_strategy: set-fields
      create_body_wrap: ""
      text_header: "\nTriggered run for eval {{ctx.id}}\n"

  # ── eval_run ──────────────────────────────────────────────────────────────────

  - command: list eval_run
    verb: list
    noun: eval_run
    short: "List runs for an AI Eval: harness list eval_run <eval_id>"
    requires_parentid: true
    parentid_label: eval
    handler_type: endpoint
    endpoint:
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/evals/{{ctx.parentId}}/runs
      request_headers:
        Harness-Account: auth.account
      items_expr: it.data
      get_id_expr: it.run_id
      query_params:
        page: flags.page
        limit: flags.limit
      paging:
        paging_strategy: page_index
        countable: true
        page_index_param: page
        page_size_param: limit
        page_size_default: 20
        page_size_max: 200
        total_expr: it.total_elements
      columns: [id, eval_id, status, total_items, success_count, started]

  - command: get eval_run
    verb: get
    noun: eval_run
    short: Get an AI Eval run by ID
    handler_type: endpoint
    endpoint:
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/runs/{{ctx.id}}
      request_headers:
        Harness-Account: auth.account
      item_expr: it

  - command: list eval_run:items
    verb: list
    noun: eval_run
    noun_variant: items
    short: "List per-item outputs and scores for an AI Eval run: harness list eval_run:items <run_id>"
    requires_parentid: true
    parentid_label: run
    handler_type: endpoint
    endpoint:
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/runs/{{ctx.parentId}}/items
      request_headers:
        Harness-Account: auth.account
      items_expr: it.data
      get_id_expr: it.id
      query_params:
        page: flags.page
        limit: flags.limit
      paging:
        paging_strategy: page_index
        countable: true
        page_index_param: page
        page_size_param: limit
        page_size_default: 20
        page_size_max: 200
        total_expr: it.total_elements
      columns: [item_id, dataset_item_id, status, duration_ms]

  # ── eval_metric ───────────────────────────────────────────────────────────────

  - command: list eval_metric
    verb: list
    noun: eval_metric
    short: List AI Evals metrics
    handler_type: endpoint
    endpoint:
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/metrics
      request_headers:
        Harness-Account: auth.account
      items_expr: it.data
      get_id_expr: it.id
      query_params:
        page: flags.page
        limit: flags.limit
      paging:
        paging_strategy: page_index
        countable: true
        page_index_param: page
        page_size_param: limit
        page_size_default: 20
        page_size_max: 200
        total_expr: it.total_elements
      columns: [id, name, type, dimension]

  - command: get eval_metric
    verb: get
    noun: eval_metric
    short: Get an AI Evals metric by ID
    handler_type: endpoint
    endpoint:
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/metrics/{{ctx.id}}
      request_headers:
        Harness-Account: auth.account
      item_expr: it

  - command: create eval_metric
    verb: create
    noun: eval_metric
    short: "Create an AI Evals metric: harness create eval_metric --set name=... type=heuristic dimension=correctness kind=exact_match"
    handler_type: endpoint
    flags_builtin:
      set: true
    endpoint:
      method: POST
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/metrics
      request_headers:
        Harness-Account: auth.account
      create_strategy: set-fields
      create_body_wrap: ""
      text_header: "\nCreated metric {{it.id}}\n"

  - command: delete eval_metric
    verb: delete
    noun: eval_metric
    confirm_mode: prompt
    short: Delete an AI Evals metric by ID
    handler_type: endpoint
    endpoint:
      method: DELETE
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/metrics/{{ctx.id}}
      request_headers:
        Harness-Account: auth.account
      item_expr: it

  # ── eval_metric_set ───────────────────────────────────────────────────────────

  - command: list eval_metric_set
    verb: list
    noun: eval_metric_set
    short: "List AI Evals metric sets: harness list eval_metric_set [--search <text>] [--target-id <uuid>]"
    handler_type: endpoint
    flags:
      - name: search
        description: Filter by name or description
      - name: target-id
        description: Filter to metric sets used by evals referencing this target UUID
    endpoint:
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/metric-sets
      request_headers:
        Harness-Account: auth.account
      items_expr: it.data
      get_id_expr: it.id
      query_params:
        page: flags.page
        limit: flags.limit
        search: flags.search
        target_id: 'flags["target-id"]'
      paging:
        paging_strategy: page_index
        countable: true
        page_index_param: page
        page_size_param: limit
        page_size_default: 20
        page_size_max: 200
        total_expr: it.total_elements
      columns: [id, name, metric_count, judge_model_id]

  - command: get eval_metric_set
    verb: get
    noun: eval_metric_set
    short: Get an AI Evals metric set by ID
    handler_type: endpoint
    endpoint:
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/metric-sets/{{ctx.id}}
      request_headers:
        Harness-Account: auth.account
      item_expr: it

  - command: create eval_metric_set
    verb: create
    noun: eval_metric_set
    short: "Create an AI Evals metric set: harness create eval_metric_set --set name=..."
    handler_type: endpoint
    flags_builtin:
      set: true
    endpoint:
      method: POST
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/metric-sets
      request_headers:
        Harness-Account: auth.account
      create_strategy: set-fields
      create_body_wrap: ""
      text_header: "\nCreated metric set {{it.id}}\n"

  - command: delete eval_metric_set
    verb: delete
    noun: eval_metric_set
    confirm_mode: prompt
    short: Delete an AI Evals metric set by ID
    handler_type: endpoint
    endpoint:
      method: DELETE
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/metric-sets/{{ctx.id}}
      request_headers:
        Harness-Account: auth.account
      item_expr: it

  # ── eval_target ───────────────────────────────────────────────────────────────

  - command: list eval_target
    verb: list
    noun: eval_target
    short: List AI Evals targets (LLM endpoints under test)
    handler_type: endpoint
    endpoint:
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/targets
      request_headers:
        Harness-Account: auth.account
      items_expr: it.data
      get_id_expr: it.id
      query_params:
        page: flags.page
        limit: flags.limit
      paging:
        paging_strategy: page_index
        countable: true
        page_index_param: page
        page_size_param: limit
        page_size_default: 20
        page_size_max: 200
        total_expr: it.total_elements
      columns: [id, name, type, connector_ref]

  - command: get eval_target
    verb: get
    noun: eval_target
    short: Get an AI Evals target by ID
    handler_type: endpoint
    endpoint:
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/targets/{{ctx.id}}
      request_headers:
        Harness-Account: auth.account
      item_expr: it

  - command: create eval_target
    verb: create
    noun: eval_target
    short: "Create an AI Evals target: harness create eval_target --set name=... type=prompt"
    handler_type: endpoint
    flags_builtin:
      set: true
    endpoint:
      method: POST
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/targets
      request_headers:
        Harness-Account: auth.account
      create_strategy: set-fields
      create_body_wrap: ""
      text_header: "\nCreated target {{it.id}}\n"

  - command: delete eval_target
    verb: delete
    noun: eval_target
    confirm_mode: prompt
    short: Delete an AI Evals target by ID
    handler_type: endpoint
    endpoint:
      method: DELETE
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/targets/{{ctx.id}}
      request_headers:
        Harness-Account: auth.account
      item_expr: it

  # ── eval_suite ────────────────────────────────────────────────────────────────

  - command: list eval_suite
    verb: list
    noun: eval_suite
    short: List AI Evals suites (collections of evaluations run together)
    handler_type: endpoint
    endpoint:
      path: /gateway/ai-evals/api/v1/orgs/{{auth.org}}/projects/{{auth.project}}/suites
      request_headers:
        Harness-Account: auth.account
      items_expr: it.data
      get_id_expr: it.suite_id
      query_params:
        page: flags.page
        limit: flags.limit
      paging:
        paging_strategy: page_index
        countable: true
        page_index_param: page
