commands:
  # ── work_item ──────────────────────────────────────────────────────────────────

  - command: list work_item
    verb: list
    noun: work_item
    short: List work items in a project
    handler_type: endpoint
    endpoint:
      path: /adlc/api/workitems
      items_expr: it.items
      get_id_expr: it.id
      query_params:
        orgIdentifier: auth.org
        projectIdentifier: auth.project
        offset: flags.page
        limit: flags.limit
      paging:
        paging_strategy: flat_list
      columns: [id, title, state, work_class, trigger_type, updated]

  - command: get work_item
    verb: get
    noun: work_item
    short: Get a single work item by ID
    handler_type: endpoint
    endpoint:
      path: /adlc/api/workitems/{{ctx.id}}
      item_expr: it
      query_params:
        orgIdentifier: auth.org
        projectIdentifier: auth.project

