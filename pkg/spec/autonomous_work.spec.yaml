spec_version: 1
module_type: builtin
module_desc: "Development Harness (ADLC) — autonomous AI-driven software work: work items, work classes, budgets, teams, members, triggers, and agent dispatch"
help_text: |
  ## Development Harness (autonomous_work)

  Development Harness is the execution plane for autonomous AI-driven software
  work. A `work_item` progresses through a lifecycle
  `plan → design → implement → review → merged` (terminal `failed`), governed
  by a `work_class`, budgets, risk evaluators, teams/members, triggers, and
  human gates.

  ### Domain Model

  - `work_item` — the core entity. List/get only; work items are created via
    Slack or the agent-execution flow, not a public POST. Resume a blocked item
    with `execute work_item:resume <id>`; approve a gate with
    `execute work_item:approve <id> --decision approve`.
  - `work_class` — the runtime model for a category of autonomous work.
  - `budget` — cost/approval budgets; grant an increment with
    `execute budget:grant <id>`; see usage with `get budget:usage <id>`.
  - `team`, `member`, `member_template` — the AI team configuration.
  - `software_component` — a component a team owns.
  - `trigger`, `capability`, `risk_evaluator` — work-config definitions.
  - `content_source_connector` — default content sources; set with
    `execute content_source_connector:set_default`.
  - `agent_execution` — launch an autonomous agent pipeline execution:
    `execute agent_execution --org <org> --project <project>`.

  All resources are project-scoped. Pass `--org` and `--project` on every
  command (or set them on the auth profile with `harness auth setscope`).

  ### Nouns

  {{nouns}}

nouns:
  - noun: work_item
    short_desc: An autonomous software work unit (plan→design→implement→review→merged).
    noun_aliases: [work_items]
    url_path: /ng/account/{{auth.account}}/module/dh/orgs/{{auth.org}}/projects/{{auth.project}}/workitems/{{it.id}}
    fields:
      - id: id
        expr: it.id
      - id: title
        expr: it.title
        width_max: 50
      - id: state
        expr: it.state
      - id: work_class
        expr: it.workClassRef.id
      - id: trigger_type
        expr: it.trigger.type
      - id: jira_key
        expr: it.trigger.jiraKey
      - id: version
        expr: it.version
        align: right
      - id: updated
        expr: epochMs(it.updatedAt)
      - id: created
        expr: epochMs(it.createdAt)

  - noun: work_class
    short_desc: A WorkClass definition — the runtime model for a category of autonomous work.
    noun_aliases: [work_classes]
    fields:
      - id: id
        expr: it.id
      - id: name
        expr: it.name
        width_max: 40
      - id: team
        expr: it.teamId.id
      - id: updated
        expr: epochMs(it.updatedAt)
      - id: created
        expr: epochMs(it.createdAt)

  - noun: work_trigger
    short_desc: A work trigger (manual / scheduled / webhook).
    noun_aliases: [work_triggers]
    fields:
      - id: id
        expr: it.id
      - id: name
        expr: it.name
        width_max: 40
      - id: updated
        expr: epochMs(it.updatedAt)
      - id: created
        expr: epochMs(it.createdAt)

  - noun: capability
    short_desc: A capability grant for work classes.
    noun_aliases: [capabilities]
    fields:
      - id: id
        expr: it.id
      - id: name
        expr: it.name
        width_max: 40
      - id: updated
        expr: epochMs(it.updatedAt)
      - id: created
        expr: epochMs(it.createdAt)

  - noun: risk_evaluator
    short_desc: A risk evaluator definition.
    noun_aliases: [risk_evaluators]
    fields:
      - id: id
        expr: it.id
      - id: name
        expr: it.name
        width_max: 40
      - id: updated
        expr: epochMs(it.updatedAt)
      - id: created
        expr: epochMs(it.createdAt)

  - noun: budget
