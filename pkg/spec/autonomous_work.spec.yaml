  - command: execute work_item:approve
    verb: execute
    noun: work_item
    noun_variant: approve
    short: Approve or reject a pending gate (--decision approve|reject)
    handler_type: endpoint
    flags:
      - name: decision
        description: "Approval decision (e.g. approve, reject)"
        required: true
      - name: reason
        description: Optional reason for the decision
