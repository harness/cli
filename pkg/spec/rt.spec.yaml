    parentid_label: "<template-id>"
    completion_noun: loadtest_template
    fields_noun: loadtest_variable
    handler_type: endpoint
    flags:
      - name: revision
        description: Revision to read (defaults to the latest)
      - name: hub
        description: Hub holding the template
    endpoint:
      path: /gateway/loadTest/manager/api/v1/load-test-templates/{{ctx.parentId}}/variables
      items_expr: 'concat(it.inputs ?? [], it.variables ?? [])'
      get_id_expr: "-"
      query_params:
        organizationIdentifier: 'auth.org != "" ? auth.org : nil'
        projectIdentifier: 'auth.project != "" ? auth.project : nil'
        revision: flags.revision
        hubIdentity: flags.hub
      paging:
        paging_strategy: flat_list
      columns: [name, value, type, required, description]

  - command: get loadtest_template:yaml
    verb: get
    noun: loadtest_template
    noun_variant: yaml
    short: "Export a template as YAML: harness get loadtest_template:yaml <template-id> [-o template.yaml]"
    id_label: "<template-id>"
    completion_noun: loadtest_template
    # Answers application/x-yaml, so it is read and written through as raw bytes.
    handler_type: workflow
    workflow_id: export_template_yaml
    flags:
      - name: revision
        description: Revision to export (defaults to the latest)
      - name: hub
        description: Hub holding the template

  # ------------------------------------------------------ composite_loadtest

  - command: list composite_loadtest
    verb: list
    noun: composite_loadtest
    short: "List composite load tests: harness list composite_loadtest"
    handler_type: endpoint
    flags:
      - name: search
        description: Filter composite RT load tests by name
    endpoint:
      path: /gateway/loadTest/manager/api/v1/composite-load-tests
      items_expr: it.items
      get_id_expr: it.pipelineIdentifier
      completion:
        id_expr: it.pipelineIdentifier
        name_expr: it.name
      query_params:
        organizationIdentifier: 'auth.org != "" ? auth.org : nil'
        projectIdentifier: 'auth.project != "" ? auth.project : nil'
        search: flags.search
      paging:
        paging_strategy: page_index
        countable: true
        page_index_param: page
        page_size_param: limit
        page_size_default: 15
        page_size_max: 100
        page_base: 0
        total_expr: it.pagination.totalItems
      columns: [pipeline_identifier, name, loadtest_count, probe_count, stage_names, last_updated_at]

  - command: create composite_loadtest
    verb: create
    noun: composite_loadtest
    requires_id: true
    short: "Create a composite load test: harness create composite_loadtest <id> --loadtest <loadtest-id> --probe <probe-id>"
    handler_type: endpoint
    flags:
      - name: name
        description: Display name (defaults to the identifier)
      - name: description
        description: Description of the composite RT load test
      - name: objective
        description: What this composite RT load test is trying to prove
      - name: loadtest
        description: Identity of the RT load test to run
        required: true
        completion_noun: loadtest
      - name: probe
        description: Identity of the chaos probe to run alongside it
        required: true
      - name: probe-infra
        description: Infrastructure reference for the probe (defaults to a runtime input)
      - name: probe-duration
        description: How long the probe runs, e.g. 10m
    endpoint:
      method: POST
      path: /gateway/loadTest/manager/api/v1/composite-load-tests
      # Keys on "identifier", not "identity", and rejects hyphens with an unclear message,
      # so the body is built in Go where the identifier is checked before the call goes out.
      body_fn: composite_body
      query_params:
        organizationIdentifier: 'auth.org != "" ? auth.org : nil'
        projectIdentifier: 'auth.project != "" ? auth.project : nil'
      item_expr: it
      no_fields: true
      text_header: "\nCreated composite load test {{it.identifier}} (pipeline {{it.pipelineIdentifier}})\n"

  # ---------------------------------------------------------- loadtest_usage

  - command: list loadtest_usage
    verb: list
    noun: loadtest_usage
    short: "Break account load testing usage down by service: harness list loadtest_usage [--from 30d]"
    handler_type: endpoint
    flags:
      - name: from
        description: Start of the window — 30d, 2w, 2026-01-01, or unix millis
      - name: to
        description: End of the window — same formats as --from
    endpoint:
      path: /gateway/loadTest/manager/api/v1/load-service-usage/details
      items_expr: it.services
      get_id_expr: it.serviceId
      # Account-wide, so no scope params. The window is built in Go: the spec cannot say "now".
      query_params_fn: usage_window
      paging:
        paging_strategy: flat_list
      columns: [service, org, project, run_count, peak_users, total_duration_sec, complexity]

  - command: get loadtest_usage
    verb: get
    noun: loadtest_usage
    no_id: true
    short: "Show total account load testing usage: harness get loadtest_usage [--from 30d]"
    fields_noun: loadtest_usage_total
    handler_type: endpoint
    flags:
      - name: from
        description: Start of the window — 30d, 2w, 2026-01-01, or unix millis
      - name: to
        description: End of the window — same formats as --from
    endpoint:
      path: /gateway/loadTest/manager/api/v1/load-service-usage/overall
      item_expr: it
      query_params_fn: usage_window

  - command: get loadtest_usage:report
    verb: get
    noun: loadtest_usage
    noun_variant: report
    no_id: true
    short: "Export the account usage report: harness get loadtest_usage:report [--from 30d] [--format csv]"
    handler_type: endpoint
    flags:
      - name: from
        description: Start of the window — 30d, 2w, 2026-01-01, or unix millis
      - name: to
        description: End of the window — same formats as --from
    endpoint:
      path: /gateway/loadTest/manager/api/v1/load-service-usage/report
      query_params_fn: usage_window
      # A matrix rather than an object, so columns come from the header row at runtime.
      item_expr: it
      no_fields: true
      list_transform_fn: usage_report_rows
