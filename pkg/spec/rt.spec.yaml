  - command: list loadtest_run
    verb: list
    noun: loadtest_run
    short: "List load test runs: harness list loadtest_run [<loadtest-id>] [--status Running]"
    parentid_label: "[<loadtest-id>]"
    completion_noun: loadtest
    handler_type: endpoint
    flags:
      - name: search
        description: Filter runs by name
      - name: status
        description: Filter by run status
        completion_values: [Pending, Running, Stopping, Stopped, Finished, Failed]
      - name: sort
        description: Field to sort by
      - name: sort-ascending
        description: Sort ascending instead of descending
        is_bool: true
    endpoint:
      # With a load test id the runs come from that test, without one from the whole scope.
      path: '{{ctx.parentId != "" ? "/gateway/loadTest/manager/api/v1/load-tests/" + ctx.parentId + "/runs" : "/gateway/loadTest/manager/api/v1/runs"}}'
      items_expr: it.items
      get_id_expr: it.identity
      completion:
        id_expr: it.identity
        name_expr: it.name
      query_params:
        organizationIdentifier: 'auth.org != "" ? auth.org : nil'
        projectIdentifier: 'auth.project != "" ? auth.project : nil'
        search: flags.search
        status: flags.status
        sortField: flags.sort
        sortAscending: 'flags["sort-ascending"] ? "true" : nil'
      paging:
        paging_strategy: page_index
        countable: true
        page_index_param: page
        page_size_param: limit
        page_size_default: 15
        page_size_max: 100
        page_base: 0
        total_expr: it.pagination.totalItems
      columns: [identity, loadtest, status, run_sequence, target_users, duration, started_at]

