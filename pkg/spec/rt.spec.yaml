    id_label: "<loadtest-id>"
    completion_noun: loadtest
    handler_type: endpoint
    endpoint:
      path: /gateway/loadTest/manager/api/v1/load-tests/{{ctx.id}}/script
      item_expr: it
      # The API returns scriptContent base64-encoded; decode it for display.
      text_formatter: format_script
      query_params:
        organizationIdentifier: 'auth.org != "" ? auth.org : nil'
        projectIdentifier: 'auth.project != "" ? auth.project : nil'

  - command: update loadtest_script
    verb: update
    noun: loadtest_script
    short: "Replace the script on a load test: harness update loadtest_script <loadtest-id> -f test.jmx"
    id_label: "<loadtest-id>"
    completion_noun: loadtest
    handler_type: endpoint
    flags:
      # Not file_body: the API stores scripts base64-encoded, so encode_script reads this flag.
      - name: file
        short: f
        description: Script file to upload, or - to read it from stdin
        required: true
      - name: description
        description: Description recorded against the new revision
    endpoint:
      method: PUT
      path: /gateway/loadTest/manager/api/v1/load-tests/{{ctx.id}}/script
      # scriptContent must be base64; the raw file is read and encoded in Go.
      body_fn: encode_script
      query_params:
        organizationIdentifier: 'auth.org != "" ? auth.org : nil'
        projectIdentifier: 'auth.project != "" ? auth.project : nil'
      no_fields: true
      text_header: "\nUpdated the script on load test {{ctx.id}}\n"

