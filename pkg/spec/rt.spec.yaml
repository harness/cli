spec_version: 1
module_type: builtin
module_desc: Resilience Testing — RT load tests, runs, templates, scripts, and usage
help_text: |
  ## Resilience Testing (rt)

  Resilience Testing (RT) is how Harness verifies the way a service holds up
  under stress. Load testing is the feature area available today: run JMeter,
  Locust, and k6 RT load tests against your services. Later RT areas add their
  own nouns under this same module, so `rt` is the module and `loadtest` is
  what you name on the command line.

  ### Domain Model

  A **loadtest** is a reusable RT load test definition: which tool to run,
  which script to run, which infrastructure and environment to run it on, and
  the tunables (target users, duration) it accepts. Creating one does not run
  anything.

  `create loadtest <id> --set toolType=K6 --set infraIdentifier=<infra> --set
  environmentIdentifier=<env>` builds the definition from key=value pairs, or
  pass a whole body with `-f test.yaml`. Use one or the other: when `-f` is
  given it supplies the entire body and `--set` is ignored.

  Two variants create a load test from something you already have:
  `create loadtest:from_json <id> -f spec.json` takes a declarative endpoint
  spec instead of a tool script, and `create loadtest:from_template <id>
  --template <template-id>` instantiates a template. A template-backed test is
  either a REFERENCE (a pointer — the template stays the source of truth) or a
  LOCAL copy. Use `execute loadtest:sync <id>` to re-pull a REFERENCE test
  after its template changes; `templateUpdateAvailable` on the test tells you
  when that is worth doing.

  Export a test with `get loadtest <id> --yaml -o test.yaml`, edit it, and
  apply it back with `update loadtest <id> -f test.yaml`.

  `list loadtest:variables <id>` shows the variables and runtime inputs the
  test accepts — the inputs you can override at run time.

  A **loadtest_run** is one execution of an RT load test.
  `execute loadtest <id>` starts a run and prints its identity; add `--follow`
  to stay attached and stream status and metrics until the run reaches a
  terminal state, exiting non-zero if it fails. Supply run-time values with
  `--set targetUsers=50`.

  Inspect runs with `list loadtest_run` (across the scope) or
  `list loadtest_run <loadtest-id>` (for one test), and
  `get loadtest_run <run-id>`. While a run is live you can retarget it with
  `update loadtest_run <run-id> --set targetUsers=200` and end it early with
  `execute loadtest_run:stop <run-id>`.

  `execute loadtest_run:rerun <run-id>` starts a fresh run of the same load
  test with the same shape.

  Results come from `get loadtest_run:summary <run-id>` for the headline
  numbers, `get loadtest_run:metrics <run-id> --view timeseries|scatter|aggregate`
  for the metric series, and `get loadtest_run:graph <run-id>` for the
  render-ready chart payload.

  A **loadtest_template** is a shareable, versioned RT load test definition.
  Templates live in hubs; `list loadtest_template` spans every hub in the
  scope unless you narrow it with `--hub`, and the HUB column names the hub
  each template came from. Every other template command targets one hub, so
  pass `--hub` when the template is not in the default (unhubbed) one.

  Templates are revisioned: `create loadtest_template:revision <id> --revision
  <rev>` adds a revision, `list loadtest_template:revision <id>` lists them,
  and `get loadtest_template:revision <id>/<rev>` fetches one.
  `get loadtest_template:yaml <id>` writes the template as a YAML document.

  A **loadtest_script** is the script attached to an RT load test, with its own
  revision history. `get loadtest_script <loadtest-id>` shows the current
  script, `list loadtest_script <loadtest-id>` lists revisions, and
  `update loadtest_script <loadtest-id> -f script.jmx` uploads a new one.

  A **composite_loadtest** is a pipeline that runs RT load tests and chaos
  probes together as stages. Identifiers must not contain hyphens — use
  underscores.

  **loadtest_usage** reports RT load testing consumption for the account. It is
  account-wide and ignores `--org` / `--project`.

  ### Nouns

  {{nouns}}

nouns:
  - noun: loadtest
    short_desc: "RT load test definitions — the tool, script, infrastructure, and tunables for a test."
    noun_aliases: [loadtests]
    fields:
      - id: identity
        label: ID
        expr: it.identity
      - id: name
        expr: it.name
        mutable_path: name
      - id: tool_type
        label: Tool
        expr: it.toolType
      - id: environment
        expr: it.environmentIdentifier
        mutable_path: environmentIdentifier
      - id: infra
        label: Infra
        expr: it.infraIdentifier
        mutable_path: infraIdentifier
      - id: target_type
        expr: it.targetType
        mutable_path: targetType
      - id: last_status
        label: Last Run
        expr: 'it.recentRuns == nil || len(it.recentRuns) == 0 ? "" : it.recentRuns[0].status'
      - id: last_executed
        expr: it.lastExecuted
      - id: target_users
        label: Users
        expr: it.targetUsers
        align: right
      - id: duration
        label: Duration (s)
        expr: it.durationSeconds
        align: right
      - id: max_duration
        label: Max Duration (s)
        expr: it.maxDurationSec
        align: right
      - id: script_source
        expr: it.scriptSource
        mutable_path: scriptSource
      - id: cleanup_policy
        expr: it.cleanupPolicy
        mutable_path: cleanupPolicy
      - id: import_type
        expr: it.importType
      - id: template
        expr: 'it.templateReference == nil ? "" : it.templateReference.identity'
      - id: template_revision
        expr: 'it.templateReference == nil ? "" : it.templateReference.revision'
      - id: template_hub
        expr: 'it.templateReference == nil ? "" : it.templateReference.hubIdentity'
      - id: update_available
        label: Update Available
        expr: it.templateUpdateAvailable
      - id: tags
        expr: it.tags
        field_type: set
        mutable_path: tags
      - id: service_references
        label: Services
        expr: it.serviceReferences
        field_type: set
        mutable_path: serviceReferences
      - id: description
        expr: it.description
        width_max: 60
        mutable_path: description
      - id: created_at
        expr: it.createdAt
      - id: created_by
        expr: it.createdBy
      - id: updated_at
        expr: it.updatedAt
      - id: updated_by
        expr: it.updatedBy
      - id: script
        expr: it.scriptContent
        field_type: multiline_text

  - noun: loadtest_run
    short_desc: "RT load test runs — one execution of an RT load test, with its live and final metrics."
    noun_aliases: [loadtest_runs]
    fields:
      - id: identity
        label: ID
        expr: it.identity
      - id: name
        expr: it.name
      - id: loadtest
        label: Load Test
        expr: it.loadTestIdentity
      - id: status
        expr: it.status
      - id: run_sequence
        label: "#"
        expr: it.runSequence
        align: right
      - id: tool_type
        label: Tool
        expr: it.toolType
      - id: target_users
        label: Users
        expr: it.targetUsers
        align: right
      - id: spawn_rate
        expr: it.spawnRate
        align: right
      - id: duration
        label: Duration (s)
        expr: it.durationSeconds
        align: right
      - id: ramp_up
        label: Ramp Up (s)
        expr: it.rampUpTimeSec
        align: right
      - id: worker_count
        label: Workers
        expr: it.workerCount
        align: right
      - id: environment
        expr: it.environmentIdentifier
      - id: infra
        label: Infra
        expr: it.infraIdentifier
      - id: target_type
        expr: it.targetType
      - id: started_at
        expr: it.startedAt
      - id: finished_at
        expr: it.finishedAt
      - id: rps
        label: RPS
        expr: 'it.lastMetrics == nil ? nil : it.lastMetrics.totalRps'
        align: right
      - id: requests
        expr: 'it.lastMetrics == nil ? nil : it.lastMetrics.totalRequests'
        align: right
      - id: failures
        expr: 'it.lastMetrics == nil ? nil : it.lastMetrics.totalFailures'
        align: right
      - id: error_rate
        expr: 'it.lastMetrics == nil ? nil : it.lastMetrics.errorRate'
        align: right
      - id: avg_response_ms
        label: Avg (ms)
        expr: 'it.lastMetrics == nil ? nil : it.lastMetrics.avgResponseMs'
        align: right
      - id: p95_response_ms
        label: P95 (ms)
        expr: 'it.lastMetrics == nil ? nil : it.lastMetrics.p95ResponseMs'
        align: right
      - id: p99_response_ms
        label: P99 (ms)
        expr: 'it.lastMetrics == nil ? nil : it.lastMetrics.p99ResponseMs'
        align: right
      - id: error_code
        expr: it.errorCode
      - id: error_message
        expr: it.errorMessage
        width_max: 80
      - id: created_at
        expr: it.createdAt
      - id: created_by
        expr: it.createdBy

  - noun: loadtest_template
    short_desc: "RT load test templates — shareable, revisioned definitions held in hubs."
    noun_aliases: [loadtest_templates]
    fields:
      - id: identity
        label: ID
        expr: it.identity
      - id: name
        expr: it.name
        mutable_path: name
      - id: revision
        expr: it.revision
      - id: hub
        label: Hub
        expr: it.hubIdentity
      - id: tool_type
        label: Tool
        expr: it.toolType
      - id: infra_type
        expr: it.infraType
        mutable_path: infraType
      - id: script_source
        expr: it.scriptSource
        mutable_path: scriptSource
      - id: tags
        expr: it.tags
        field_type: set
        mutable_path: tags
      - id: description
        expr: it.description
        width_max: 60
        mutable_path: description
      - id: created_at
        expr: it.createdAt
      - id: created_by
        expr: it.createdBy
      - id: updated_at
        expr: it.updatedAt
      - id: updated_by
        expr: it.updatedBy
      - id: script
        expr: it.scriptContent
        field_type: multiline_text

  - noun: loadtest_script
    short_desc: "RT load test scripts — the script attached to an RT load test, and its revisions."
    noun_aliases: [loadtest_scripts]
    fields:
      - id: identity
        label: ID
        expr: it.identity
      - id: revision_number
        label: Rev
        expr: it.revisionNumber
        align: right
      - id: loadtest
        label: Load Test
        expr: it.loadTestIdentity
      - id: description
        expr: it.description
        width_max: 60
      - id: is_bundle
        label: Bundle
        expr: it.isBundle
      - id: bundle_main_file
        expr: it.bundleMainFile
      - id: created_at
        expr: it.createdAt
      - id: created_by
        expr: it.createdBy
      - id: script
        expr: 'coalesce(it.scriptContent, it.bundleMainContent)'
        field_type: multiline_text

  - noun: composite_loadtest
    short_desc: "Composite RT load tests — pipelines that run RT load tests and chaos probes as stages."
    noun_aliases: [composite_loadtests]
    fields:
      - id: pipeline_identifier
        label: ID
        expr: it.pipelineIdentifier
      - id: name
        expr: it.name
      - id: loadtest_count
        label: Load Tests
        expr: it.loadTestCount
        align: right
      - id: probe_count
        label: Probes
        expr: it.probeCount
        align: right
      - id: stage_names
        label: Stages
        expr: it.stageNames
        field_type: set
      - id: tags
        expr: it.tags
        field_type: tags
      - id: description
        expr: it.description
        width_max: 60
      # Epoch millis: without epochMs the table prints a float64 as 1.787e+12.
      - id: created_at
        expr: epochMs(it.createdAt)
        field_type: ts
      - id: last_updated_at
        expr: epochMs(it.lastUpdatedAt)
        field_type: ts

  - noun: loadtest_variable
    short_desc: "Variables and runtime inputs an RT load test or template accepts."
    noun_aliases: [loadtest_variables]
    fields:
      - id: name
        expr: it.name
      - id: value
        expr: it.value
      - id: type
        expr: it.type
      - id: required
        expr: it.required
      - id: category
        expr: it.category
      - id: default
        expr: it.default
      - id: allowed_values
        expr: it.allowedValues
        field_type: set
      - id: description
        expr: it.description
        width_max: 60

  - noun: loadtest_run_summary
    short_desc: "Headline result of a finished or running RT load test run."
    fields:
      - id: run_id
        label: Run
        expr: it.runId
      - id: run_name
        expr: it.runName
      - id: status
        expr: it.status
      - id: duration
        expr: it.duration
      - id: total_requests
        expr: it.totalRequests
        align: right
      - id: rps
        label: RPS
        expr: it.requestsPerSec
        align: right
      - id: error_rate
        label: Error Rate (%)
        expr: it.errorRate
        align: right
      - id: avg_response_s
        label: Avg (s)
        expr: it.avgResponseTime
        align: right
      - id: p50_response_ms
        label: P50 (ms)
        expr: it.p50ResponseMs
        align: right
      - id: p95_response_ms
        label: P95 (ms)
        expr: it.p95ResponseMs
        align: right
      - id: p99_response_ms
        label: P99 (ms)
        expr: it.p99ResponseMs
        align: right
      - id: peak_vus
        label: Peak VUs
        expr: it.peakVUs
        align: right
      - id: iterations
        expr: it.iterationsCompleted
        align: right
      - id: target_users
        label: Target Users
        expr: it.targetUsers
        align: right
      - id: spawn_rate
        expr: it.spawnRate
        align: right
      - id: duration_seconds
        label: Duration (s)
        expr: it.durationSeconds
        align: right
      - id: started_at
        expr: it.startedAt
      - id: finished_at
        expr: it.finishedAt

  - noun: loadtest_metric
    short_desc: "One time-series sample taken during an RT load test run."
    noun_aliases: [loadtest_metrics]
    fields:
      - id: timestamp
        expr: it.timestamp
      - id: rps
        label: RPS
        expr: it.totalRps
        align: right
      - id: users
        expr: it.currentUsers
        align: right
      - id: p50_response_ms
        label: P50 (ms)
        expr: it.p50ResponseMs
        align: right
      - id: p95_response_ms
        label: P95 (ms)
        expr: it.p95ResponseMs
        align: right
      - id: p99_response_ms
        label: P99 (ms)
        expr: it.p99ResponseMs
        align: right
      - id: error_rate
        label: Error Rate (%)
        expr: it.errorRate
        align: right

  - noun: loadtest_graph_point
    short_desc: "One plotting sample from an RT load test run — the minimal series behind the run chart."
    noun_aliases: [loadtest_graph_points]
    fields:
      - id: timestamp
        expr: epochMs(it.timestamp)
      - id: users
        expr: it.users
        align: right
      - id: rps
        label: RPS
        expr: it.requestsPerSec
        align: right
      - id: errors_per_sec
        label: Errors/s
        expr: it.errorsPerSec
        align: right
      - id: avg_response_s
        label: Avg (s)
        expr: it.avgResponseTime
        align: right

  - noun: loadtest_request
    short_desc: "One sampled request from an RT load test run, for response-time distribution."
    noun_aliases: [loadtest_requests]
    fields:
      - id: timestamp
        expr: it.timestamp
      - id: method
        expr: it.method
      - id: endpoint
        expr: it.endpoint
      - id: response_time_ms
        label: Response (ms)
        expr: it.responseTimeMs
        align: right
      - id: success
        expr: it.success

  - noun: loadtest_endpoint_stat
    short_desc: "Per-endpoint request statistics aggregated across an RT load test run."
    noun_aliases: [loadtest_endpoint_stats]
    fields:
      - id: method
        expr: it.method
      - id: endpoint
        expr: it.endpoint
      - id: total_requests
        expr: it.totalRequests
        align: right
      - id: total_failures
        expr: it.totalFailures
        align: right
      - id: error_rate
        label: Error Rate (%)
        expr: it.errorRate
        align: right
      - id: avg_response_ms
        label: Avg (ms)
        expr: it.avgResponseTimeMs
        align: right
      - id: min_response_ms
        label: Min (ms)
        expr: it.minResponseTimeMs
        align: right
      - id: max_response_ms
        label: Max (ms)
        expr: it.maxResponseTimeMs
        align: right
      - id: p50_response_ms
        label: P50 (ms)
        expr: it.p50ResponseMs
        align: right
      - id: rps
        label: RPS
        expr: it.avgRps
        align: right

  - noun: loadtest_usage
    short_desc: "Per-service RT load testing consumption. Account-wide; ignores --org and --project."
    noun_aliases: [loadtest_usages]
    fields:
      - id: service
        label: Service
        expr: it.serviceId
      - id: org
        expr: it.orgId
      - id: project
        expr: it.projectId
      - id: run_count
        label: Runs
        expr: it.runCount
        align: right
      - id: peak_users
        expr: it.peakUsers
        align: right
      - id: max_worker_count
        label: Max Workers
        expr: it.maxWorkerCount
        align: right
      - id: total_duration_sec
        label: Duration (s)
        expr: it.totalDurationSec
        align: right
      - id: total_vu_seconds
        label: VU Seconds
        expr: it.totalVuSeconds
        align: right
      - id: tool_types
        label: Tools
        expr: it.toolTypes
        field_type: set
      - id: infra_types
        label: Infra
        expr: it.infraTypes
        field_type: set
      - id: complexity
        expr: it.complexity
        align: right

  - noun: loadtest_usage_total
    short_desc: "Account-wide RT load testing consumption total and the weighting behind it."
    fields:
      - id: account
        expr: it.accountId
      - id: total_usage
        label: Total Usage
        expr: it.totalUsage
        align: right
      - id: service_count
        label: Services
        expr: it.serviceCount
        align: right
      - id: base_service_weight
        expr: 'it.ratioConfig == nil ? nil : it.ratioConfig.baseServiceWeight'
        align: right
      - id: metric_weights
        expr: 'it.ratioConfig == nil ? nil : formatMetadata(it.ratioConfig.metricWeights)'
      - id: metric_thresholds
        expr: 'it.ratioConfig == nil ? nil : formatMetadata(it.ratioConfig.metricThresholds)'
      - id: updated_at
        expr: 'it.ratioConfig == nil ? nil : epochMs(it.ratioConfig.updatedAt)'
      - id: updated_by
        expr: 'it.ratioConfig == nil ? nil : it.ratioConfig.updatedBy'

commands:
  # ---------------------------------------------------------------- loadtest

  - command: list loadtest
    verb: list
    noun: loadtest
    short: "List load tests: harness list loadtest [--search <text>] [--tool JMeter|Locust|K6] [--status <status>]"
    handler_type: endpoint
    flags:
      - name: search
        description: Filter RT load tests by name
      - name: tool
        description: Filter by tool type
        completion_values: [JMeter, Locust, K6]
      - name: environment
        description: Filter by environment identifier
      - name: status
        description: Filter by last run status
        completion_values: [Pending, Running, Stopping, Stopped, Finished, Failed]
      - name: tag
        description: Filter by tag (repeatable)
        is_multi: true
      - name: sort
        description: Field to sort by
      - name: sort-ascending
        description: Sort ascending instead of descending
        is_bool: true
    endpoint:
      path: /gateway/loadTest/manager/api/v1/load-tests
      items_expr: it.items
      get_id_expr: it.identity
      completion:
        id_expr: it.identity
        name_expr: it.name
      query_params:
        organizationIdentifier: 'auth.org != "" ? auth.org : nil'
        projectIdentifier: 'auth.project != "" ? auth.project : nil'
        search: flags.search
        toolType: flags.tool
        environmentIdentifier: flags.environment
        status: flags.status
        sortField: flags.sort
        sortAscending: 'flags["sort-ascending"] ? "true" : nil'
      # A repeatable flag cannot go through query_params: it formats as "[]", not joined.
      query_params_fn: loadtest_filters
      paging:
        paging_strategy: page_index
        countable: true
        page_index_param: page
        page_size_param: limit
        page_size_default: 15
        page_size_max: 100
        page_base: 0
        total_expr: it.pagination.totalItems
      columns: [identity, name, tool_type, environment, last_status, last_executed]

  - command: get loadtest
    verb: get
    noun: loadtest
    short: "Get a load test: harness get loadtest <id> [--yaml]"
    id_label: "<loadtest-id>"
    handler_type: endpoint
    endpoint:
      path: /gateway/loadTest/manager/api/v1/load-tests/{{ctx.id}}
      item_expr: it
      yaml_pick_expr: it
      yaml_exclude:
        - uniqueId
        - parentUniqueId
        - accountIdentifier
        - organizationIdentifier
        - projectIdentifier
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
        - createdByUserDetails
        - updatedByUserDetails
        - recentRuns
        - lastExecuted
        - latestRevisionIdentifier
        - templateUpdateAvailable
      query_params:
        organizationIdentifier: 'auth.org != "" ? auth.org : nil'
        projectIdentifier: 'auth.project != "" ? auth.project : nil'

  - command: create loadtest
    verb: create
    noun: loadtest
    requires_id: true
    short: "Create a load test: harness create loadtest <id> --set toolType=K6 --set infraIdentifier=<infra> --set environmentIdentifier=<env>, or -f test.yaml"
    flags_builtin:
      set: true
    handler_type: endpoint
    endpoint:
      method: POST
      path: /gateway/loadTest/manager/api/v1/load-tests
      file_body: optional
      create_strategy: set-fields
      create_body_init:
        identity: ctx.id
        name: coalesce(ctx.setArgs.name, ctx.id)
      query_params:
        organizationIdentifier: 'auth.org != "" ? auth.org : nil'
        projectIdentifier: 'auth.project != "" ? auth.project : nil'
      item_expr: it
      text_footer: "\nStart it with: harness execute loadtest {{it.identity}}\n"

  - command: create loadtest:from_json
    verb: create
    noun: loadtest
    noun_variant: from_json
    requires_id: true
    short: "Create a load test from a JSON endpoint spec: harness create loadtest:from_json <id> -f spec.json --set infraIdentifier=<infra> --set environmentIdentifier=<env>"
    flags_builtin:
      set: true
    handler_type: endpoint
    endpoint:
      method: POST
      path: /gateway/loadTest/manager/api/v1/load-tests/from-json
      file_body: optional
      create_strategy: set-fields
      create_body_init:
        identity: ctx.id
        name: coalesce(ctx.setArgs.name, ctx.id)
      query_params:
        organizationIdentifier: 'auth.org != "" ? auth.org : nil'
        projectIdentifier: 'auth.project != "" ? auth.project : nil'
      item_expr: it
      text_footer: "\nStart it with: harness execute loadtest {{it.identity}}\n"

  - command: create loadtest:from_template
    verb: create
    noun: loadtest
    noun_variant: from_template
    requires_id: true
    short: "Create a load test from a template: harness create loadtest:from_template <id> --template <template-id> [--revision <rev>] [--import-type REFERENCE|LOCAL]"
    flags_builtin:
      set: true
    flags:
      - name: template
        description: Identity of the template to instantiate
        required: true
        completion_noun: loadtest_template
      - name: revision
        description: Template revision to pin (defaults to the latest)
      - name: hub
        description: Hub holding the template
      - name: import-type
        description: REFERENCE keeps the template as the source of truth; LOCAL copies it
        default: REFERENCE
        completion_values: [REFERENCE, LOCAL]
    handler_type: endpoint
    endpoint:
      method: POST
      path: /gateway/loadTest/manager/api/v1/load-tests/from-template
      file_body: optional
      create_strategy: set-fields
      create_body_init:
        identity: ctx.id
        name: coalesce(ctx.setArgs.name, ctx.id)
        importType: flags["import-type"]
        templateReference.identity: flags.template
        templateReference.revision: 'flags.revision != "" ? flags.revision : nil'
        templateReference.hubIdentity: 'flags.hub != "" ? flags.hub : nil'
      query_params:
        organizationIdentifier: 'auth.org != "" ? auth.org : nil'
        projectIdentifier: 'auth.project != "" ? auth.project : nil'
      item_expr: it
      text_footer: "\nStart it with: harness execute loadtest {{it.identity}}\n"

  - command: update loadtest
    verb: update
    noun: loadtest
    short: "Update a load test: harness update loadtest <id> --set name=<name>, or -f test.yaml"
