    handler_type: endpoint
    endpoint:
      path: /gateway/loadTest/manager/api/v1/load-tests/{{ctx.parentId}}/script/revisions
      # A bare array rather than a page, so there is no envelope to read a total from.
      items_expr: it
      get_id_expr: it.identity
      query_params:
        organizationIdentifier: 'auth.org != "" ? auth.org : nil'
        projectIdentifier: 'auth.project != "" ? auth.project : nil'
      paging:
        paging_strategy: flat_list
      columns: [revision_number, identity, description, is_bundle, created_at, created_by]

