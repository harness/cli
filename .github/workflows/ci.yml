name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Build, Test & Validate Specs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            modules/har/go.sum

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.48.0

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          only-new-issues: true

      - name: Unit tests
        run: go test ./... -race -count=1

      - name: Build
        run: task build

      - name: Validate specs
        run: task check:specs

  release-grammar-subset:
    name: Verify release grammar subset
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x

      # This builds the same cross-platform artifacts that release.yml publishes.
      - name: Build snapshot release artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          args: build --snapshot --clean
        env:
          SEGMENT_WRITE_KEY: ""

      - name: Verify embedded grammar subset
        run: ./scripts/verify-release-grammar-subset.sh dist
