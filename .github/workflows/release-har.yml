name: Release har plugin

on:
  push:
    tags:
      - "har/v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release-har:
    name: Publish har plugin release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: modules/har/go.mod
          cache: true

      - name: Build and publish
        run: ./scripts/release-har.sh "${GITHUB_REF#refs/tags/}" --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
