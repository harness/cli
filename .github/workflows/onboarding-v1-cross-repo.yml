---
name: Onboarding v1 cross-repo

# Dedicated compatibility check; the normal D4 Go tests remain self-contained.
# D2_REF is the full reviewed commit on onboarding-d2-local-runner that
# contains the onboarding/v1 loader and the D4 fixture contract. Update this
# reference, its checksum verification, and the mirrored fixture together as
# documented in docs/onboarding-v1-cross-repo.md.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:

permissions:
  contents: read

env:
  D2_REPOSITORY: harness/ai-evals
  D2_REF: 8617179d2a072fd019ad9729dfd2c8ab02096f77
  D2_BRANCH: onboarding-d2-local-runner
  HARNESS_PYPI_HOST: https://harness0.harness.io
  HARNESS_PYPI_PREFIX: /pkg/l7B_kbSEQD2wjrM7PShm5w/
  HARNESS_PYPI_PATH: harness-pip-internal/python/simple/
  HARNESS_EVALS_VERSION: "0.28.2"

jobs:
  compatibility:
    name: Load the D4 fixture with pinned D2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out pinned D2 source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.D2_REPOSITORY }}
          ref: ${{ env.D2_REF }}
          path: .ci/d2
          token: ${{ secrets.AI_EVALS_READ_TOKEN }}

      - name: Verify the D2 revision and onboarding contract
        working-directory: .ci/d2
        run: |
          test "$(git rev-parse HEAD)" = "${D2_REF}"
          grep -q \
            'SCHEMA_VERSION_V1 = "onboarding/v1"' \
            service/ai_evals/onboarding/contract.py

      - name: Install the pinned D2 runner environment
        working-directory: .ci/d2
        env:
          HARNESS_PYPI_USERNAME: ${{ secrets.HARNESS_PYPI_USERNAME }}
          HARNESS_PYPI_PASSWORD: ${{ secrets.HARNESS_PYPI_PASSWORD }}
        run: |
          cp pyproject.runner.toml pyproject.toml
          repository="${HARNESS_PYPI_HOST}${HARNESS_PYPI_PREFIX}"
          repository="${repository}${HARNESS_PYPI_PATH}"
          python - "${HARNESS_EVALS_VERSION}" "$repository" <<'PY'
          from pathlib import Path
          import re
          import sys

          version, repository = sys.argv[1:]
          path = Path("pyproject.toml")
          text = path.read_text()
          text, count = re.subn(
              r'harness-evals = \{path = "[^"]+", extras = \["all"\]\}',
              (
                  f'harness-evals = {{ version = "{version}", '
                  'extras = ["all"], source = "harness-pypi" }}'
              ),
              text,
          )
          if count != 1:
              raise SystemExit(
                  "the pinned D2 runner manifest no longer has its expected "
                  "harness-evals path dependency"
              )
          path.write_text(
              text
              + (
                  "\n[[tool.poetry.source]]\n"
                  'name = "harness-pypi"\n'
                  f'url = "{repository}"\n'
                  'priority = "explicit"\n'
              )
          )
          PY
          poetry config virtualenvs.in-project true
          poetry config http-basic.harness-pypi \
            "$HARNESS_PYPI_USERNAME" "$HARNESS_PYPI_PASSWORD"
          poetry lock
          poetry install --only main --all-extras \
            --no-interaction --no-ansi

      - name: Run D2 loader against the D4 fixture
        env:
          D2_ONBOARDING_ROOT: ${{ github.workspace }}/.ci/d2
        run: |
          ./scripts/check_d4_onboarding_v1.sh
